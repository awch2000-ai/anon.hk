<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>anon.hk | 後台管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-8 font-sans">

  <div class="max-w-4xl mx-auto space-y-8">
    <!-- 頂部標題欄 -->
    <div class="flex items-center justify-between border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold">⚙️ anon.hk 應用程式管理後台</h1>
        <p class="text-xs text-slate-400">一鍵上傳、編輯單頁 HTML 檔案並自動同步至首頁清單</p>
      </div>
      <a href="./index.html" class="text-xs px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 transition">
        ← 返回首頁
      </a>
    </div>

    <!-- GitHub 連結設定區 -->
    <details id="settingsBox" class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
      <summary class="cursor-pointer font-semibold text-sm flex items-center justify-between">
        <span>🔑 GitHub 儲存庫及 Token 設定（只會儲存在你的瀏覽器內）</span>
        <span id="configStatus" class="text-xs text-amber-400">尚未設定</span>
      </summary>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-4 pt-4 border-t border-slate-800">
        <div>
          <label class="block text-xs text-slate-400 mb-1">GitHub 用戶名稱 (Owner)</label>
          <input id="ghOwner" type="text" value="awch2000-ai" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">儲存庫名稱 (Repository)</label>
          <input id="ghRepo" type="text" value="anon.hk" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">分支名稱 (Branch)</label>
          <input id="ghBranch" type="text" value="main" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
        </div>
        <div class="sm:col-span-3">
          <label class="block text-xs text-slate-400 mb-1">Fine-Grained Personal Access Token（需開啟 Contents: Read & Write 權限）</label>
          <input id="ghToken" type="password" placeholder="github_pat_..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
        </div>
        <div class="sm:col-span-3 flex justify-end">
          <button onclick="saveConfig()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-xs font-semibold transition">
            💾 儲存設定至瀏覽器
          </button>
        </div>
      </div>
    </details>

    <!-- 上傳與編輯表單 -->
    <div id="formCard" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-5 transition-all">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <div class="flex items-center gap-2.5">
          <h2 id="formHeading" class="text-lg font-semibold">🚀 發佈新 HTML 應用</h2>
          <span id="editBadge" class="hidden text-xs px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40 font-medium">
            編輯模式
          </span>
        </div>
        <button
          id="cancelEditBtn"
          onclick="resetForm()"
          class="hidden text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition"
        >
          ✕ 取消編輯（切換回新增模式）
        </button>
      </div>

      <!-- 拖放上傳區 -->
      <div
        id="dropZone"
        class="border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-xl p-6 text-center cursor-pointer transition bg-slate-950/50"
        onclick="document.getElementById('fileInput').click()"
      >
        <input id="fileInput" type="file" accept=".html,.htm" class="hidden" onchange="handleFileSelect(event)" />
        <p class="text-sm text-slate-300 font-medium" id="dropLabel">📂 點擊此處或拖放單頁 <code class="text-indigo-400">.html</code> 檔案</p>
        <p class="text-xs text-slate-500 mt-1">在編輯模式下，你亦可以直接修改下方欄位或替換新的 HTML 檔案</p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">應用程式名稱 (Title) *</label>
          <input id="appTitle" type="text" placeholder="例如：課室抽籤小工具" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" oninput="autoSlug()" />
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">網址代稱 Slug（路徑為 <code class="text-indigo-400">/apps/代稱.html</code>）*</label>
          <input id="appSlug" type="text" placeholder="例如：lucky-draw" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" />
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">分類標籤 (Category)</label>
          <input id="appCategory" type="text" placeholder="例如：教學工具、實用工具、AI、小遊戲" value="實用工具" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" />
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">代表圖示 (Emoji Icon)</label>
          <input id="appIcon" type="text" value="🚀" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" />
        </div>
        <div class="sm:col-span-2">
          <label class="block text-xs text-slate-400 mb-1">簡短介紹 (Description)</label>
          <input id="appDesc" type="text" placeholder="簡單介紹這個工具的功能（會顯示在首頁卡片上）..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" />
        </div>
        <div class="sm:col-span-2">
          <div class="flex items-center justify-between mb-1">
            <label class="block text-xs text-slate-400">HTML 完整原始碼 <span id="htmlHint" class="text-slate-500">（新增應用時必填；編輯模式下若留空則只更新上方卡片資料）</span></label>
            <span id="htmlLoadStatus" class="text-xs text-indigo-400"></span>
          </div>
          <textarea id="appHtml" rows="7" placeholder="<!DOCTYPE html><html>...</html>" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs font-mono text-slate-200 focus:outline-none focus:border-indigo-500"></textarea>
        </div>
      </div>

      <div class="flex items-center justify-between pt-2 flex-wrap gap-3">
        <span id="statusMsg" class="text-xs text-slate-400"></span>
        <div class="flex items-center gap-2 ml-auto">
          <button
            id="resetBtn"
            onclick="resetForm()"
            class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-medium text-slate-300 transition"
          >
            清空表單
          </button>
          <button
            id="publishBtn"
            onclick="publishApp()"
            class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-sm font-semibold shadow-lg shadow-indigo-600/30 transition"
          >
            ⬆️ 一鍵上傳並加入首頁
          </button>
        </div>
      </div>
    </div>

    <!-- 已發佈應用管理列表 -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="text-lg font-semibold">📦 已發佈的應用程式</h2>
          <p class="text-xs text-slate-400">點擊「✏️ 編輯」即可修改名稱、分類、簡介或更新 HTML 原始碼</p>
        </div>
        <button onclick="fetchCurrentApps()" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-indigo-400 border border-slate-700 transition">
          ↻ 重新整理
        </button>
      </div>
      <div id="adminAppsList" class="divide-y divide-slate-800 text-sm">
        <p class="text-slate-500 text-xs py-4">請先在上方完成 GitHub Token 設定以載入應用清單。</p>
      </div>
    </div>
  </div>

  <script>
    let cachedApps = [];
    let editingOriginalSlug = null; // 追蹤目前正在編輯哪個 App

    // 支援中文及 Emoji 的 UTF-8 Base64 編碼與解碼函數
    function toBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      bytes.forEach(b => binary += String.fromCharCode(b));
      return btoa(binary);
    }

    function fromBase64(base64) {
      const binary = atob(base64.replace(/\n/g, ''));
      const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function getConfig() {
      return {
        owner: localStorage.getItem('gh_owner') || 'awch2000-ai',
        repo: localStorage.getItem('gh_repo') || 'anon.hk',
        branch: localStorage.getItem('gh_branch') || 'main',
        token: localStorage.getItem('gh_token') || ''
      };
    }

    function saveConfig() {
      localStorage.setItem('gh_owner', document.getElementById('ghOwner').value.trim());
      localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
      localStorage.setItem('gh_branch', document.getElementById('ghBranch').value.trim() || 'main');
      localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
      updateConfigUI();
      fetchCurrentApps();
    }

    function updateConfigUI() {
      const cfg = getConfig();
      document.getElementById('ghOwner').value = cfg.owner;
      document.getElementById('ghRepo').value = cfg.repo;
      document.getElementById('ghBranch').value = cfg.branch;
      document.getElementById('ghToken').value = cfg.token;

      const status = document.getElementById('configStatus');
      if (cfg.owner && cfg.repo && cfg.token) {
        status.textContent = `已連結：${cfg.owner}/${cfg.repo}`;
        status.className = 'text-xs text-emerald-400';
      } else {
        status.textContent = '尚未設定 Token';
        status.className = 'text-xs text-amber-400';
        document.getElementById('settingsBox').open = true;
      }
    }

    function autoSlug() {
      // 在編輯模式下，不自動覆蓋用戶原有的 Slug，以免誤改網址
      if (editingOriginalSlug) return;
      const title = document.getElementById('appTitle').value;
      const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      if (slug) document.getElementById('appSlug').value = slug;
    }

    // 切換至「編輯模式」並載入該 App 的資料及 HTML
    async function startEditApp(slug) {
      const app = cachedApps.find(a => a.slug === slug);
      if (!app) return;

      editingOriginalSlug = app.slug;

      // 填入現有欄位資料
      document.getElementById('appTitle').value = app.title || '';
      document.getElementById('appSlug').value = app.slug || '';
      document.getElementById('appCategory').value = app.category || '實用工具';
      document.getElementById('appIcon').value = app.icon || '🚀';
      document.getElementById('appDesc').value = app.description || '';
      document.getElementById('appHtml').value = '';
      document.getElementById('dropLabel').textContent = `📂 如需替換 ${app.path}，可點擊或拖放新的 .html 檔案`;

      // 更新介面為編輯狀態
      document.getElementById('formHeading').textContent = `✏️ 正在編輯：${app.title}`;
      document.getElementById('editBadge').classList.remove('hidden');
      document.getElementById('cancelEditBtn').classList.remove('hidden');
      document.getElementById('publishBtn').textContent = '💾 儲存修改';
      document.getElementById('formCard').classList.add('border-amber-500/60');
      document.getElementById('statusMsg').textContent = '';

      // 滾動至表單頂部
      document.getElementById('formCard').scrollIntoView({ behavior: 'smooth', block: 'start' });

      // 從 GitHub 載入該 App 目前的 HTML 原始碼，方便直接修改
      const htmlStatus = document.getElementById('htmlLoadStatus');
      htmlStatus.textContent = '⏳ 正在從 GitHub 讀取現有 HTML 原始碼...';
      try {
        const existingFile = await getFileShaAndContent(app.path);
        if (existingFile.content !== null) {
          document.getElementById('appHtml').value = existingFile.content;
          htmlStatus.textContent = '✅ 已載入現有 HTML 原始碼（可直接修改）';
        } else {
          htmlStatus.textContent = '⚠️ 找不到原始 HTML 檔案，請重新上傳或貼上 HTML';
        }
      } catch (err) {
        htmlStatus.textContent = '⚠️ 讀取 HTML 失敗，但你仍可直接儲存上方卡片資料修改';
      }
    }

    // 重置表單並返回「新增模式」
    function resetForm() {
      editingOriginalSlug = null;
      document.getElementById('appTitle').value = '';
      document.getElementById('appSlug').value = '';
      document.getElementById('appCategory').value = '實用工具';
      document.getElementById('appIcon').value = '🚀';
      document.getElementById('appDesc').value = '';
      document.getElementById('appHtml').value = '';
      document.getElementById('fileInput').value = '';
      document.getElementById('dropLabel').innerHTML = '📂 點擊此處或拖放單頁 <code class="text-indigo-400">.html</code> 檔案';
      document.getElementById('htmlLoadStatus').textContent = '';
      document.getElementById('statusMsg').textContent = '';

      document.getElementById('formHeading').textContent = '🚀 發佈新 HTML 應用';
      document.getElementById('editBadge').classList.add('hidden');
      document.getElementById('cancelEditBtn').classList.add('hidden');
      document.getElementById('publishBtn').textContent = '⬆️ 一鍵上傳並加入首頁';
      document.getElementById('formCard').classList.remove('border-amber-500/60');
    }

    // 拖放檔案及讀取處理
    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('border-indigo-500'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-indigo-500'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('border-indigo-500');
      if (e.dataTransfer.files.length) readFile(e.dataTransfer.files[0]);
    });

    function handleFileSelect(e) {
      if (e.target.files.length) readFile(e.target.files[0]);
    }

    function readFile(file) {
      const reader = new FileReader();
      reader.onload = e => {
        const content = e.target.result;
        document.getElementById('appHtml').value = content;
        document.getElementById('dropLabel').textContent = `✅ 已載入檔案：${file.name}`;
        document.getElementById('htmlLoadStatus').textContent = '✅ 已載入新上傳的 HTML 檔案';

        // 若在新增模式，自動擷取 HTML 內的 <title> 及檔名
        if (!editingOriginalSlug) {
          const titleMatch = content.match(/<title[^>]*>([^<]+)<\/title>/i);
          const baseName = file.name.replace(/\.html?$/i, '');
          if (!document.getElementById('appTitle').value) {
            document.getElementById('appTitle').value = titleMatch ? titleMatch[1].trim() : baseName;
          }
          const cleanSlug = baseName.toLowerCase().replace(/[^a-z0-9-_]+/g, '-').replace(/^-|-$/g, '');
          document.getElementById('appSlug').value = cleanSlug || `app-${Date.now()}`;
        }
      };
      reader.readAsText(file);
    }

    // GitHub API 請求輔助函數
    async function ghRequest(path, method = 'GET', body = null) {
      const { owner, repo, token } = getConfig();
      const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
        method,
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: body ? JSON.stringify(body) : null
      });
      return res;
    }

    async function getFileShaAndContent(path) {
      const { branch } = getConfig();
      const res = await ghRequest(`${path}?ref=${branch}`);
      if (res.status === 404) return { sha: null, content: null };
      if (!res.ok) throw new Error(`GitHub API 錯誤 (${res.status})`);
      const data = await res.json();
      return { sha: data.sha, content: fromBase64(data.content) };
    }

    async function putFile(path, plainTextContent, message) {
      const { branch } = getConfig();
      const existing = await getFileShaAndContent(path);
      const payload = {
        message,
        content: toBase64(plainTextContent),
        branch
      };
      if (existing.sha) payload.sha = existing.sha;
      const res = await ghRequest(path, 'PUT', payload);
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.message || '上傳失敗');
      }
    }

    async function publishApp() {
      const title = document.getElementById('appTitle').value.trim();
      const slug = document.getElementById('appSlug').value.trim().replace(/\.html?$/i, '');
      const category = document.getElementById('appCategory').value.trim() || '一般';
      const icon = document.getElementById('appIcon').value.trim() || '🚀';
      const description = document.getElementById('appDesc').value.trim();
      const html = document.getElementById('appHtml').value;

      if (!title || !slug) {
        alert('請填寫「應用程式名稱」及「網址代稱 (Slug)」。');
        return;
      }

      if (!editingOriginalSlug && !html.trim()) {
        alert('發佈新應用時，請選擇或貼上 HTML 原始碼。');
        return;
      }

      const btn = document.getElementById('publishBtn');
      const status = document.getElementById('statusMsg');
      const { branch } = getConfig();
      btn.disabled = true;

      try {
        const newAppPath = `apps/${slug}.html`;
        const oldAppPath = editingOriginalSlug ? `apps/${editingOriginalSlug}.html` : null;

        // 1. 如果有提供 HTML 內容，上傳/更新 HTML 檔案
        if (html.trim()) {
          status.textContent = '⏳ 正在儲存 HTML 檔案至 GitHub...';
          await putFile(newAppPath, html, `${editingOriginalSlug ? 'Update' : 'Publish'} app: ${title}`);
        } else if (editingOriginalSlug && editingOriginalSlug !== slug) {
          // 若用戶更改了 Slug 但沒有填 HTML，嘗試把舊檔案內容搬過去
          const oldFile = await getFileShaAndContent(oldAppPath);
          if (oldFile.content) {
            await putFile(newAppPath, oldFile.content, `Rename app to ${slug}`);
          }
        }

        // 2. 若在編輯模式下修改了 Slug（重新命名），刪除舊路徑的 HTML 檔案
        if (editingOriginalSlug && editingOriginalSlug !== slug && oldAppPath) {
          status.textContent = '⏳ 正在清理舊路徑檔案...';
          const oldTarget = await getFileShaAndContent(oldAppPath);
          if (oldTarget.sha) {
            await ghRequest(oldAppPath, 'DELETE', {
              message: `Remove old file ${oldAppPath} after rename`,
              sha: oldTarget.sha,
              branch
            });
          }
        }

        // 3. 讀取並更新 apps.json
        status.textContent = '⏳ 正在同步更新 apps.json 首頁清單...';
        const manifestFile = await getFileShaAndContent('apps.json');
        let apps = [];
        if (manifestFile.content) {
          try { apps = JSON.parse(manifestFile.content); } catch (e) { apps = []; }
        }

        const lookupSlug = editingOriginalSlug || slug;
        const existingIdx = apps.findIndex(a => a.slug === lookupSlug);
        const existingDate = existingIdx >= 0 ? apps[existingIdx].date : null;

        const updatedEntry = {
          slug,
          title,
          path: newAppPath,
          category,
          icon,
          description,
          date: existingDate || new Date().toISOString().split('T')[0]
        };

        if (existingIdx >= 0) {
          apps[existingIdx] = updatedEntry;
        } else {
          apps.unshift(updatedEntry);
        }

        await putFile('apps.json', JSON.stringify(apps, null, 2), `Update apps.json for ${title}`);

        const wasEditing = Boolean(editingOriginalSlug);
        resetForm();
        status.textContent = wasEditing
          ? `✅ 已成功更新「${title}」！將於約 30 秒內在首頁生效。`
          : `✅ 發佈成功！路徑：/${newAppPath}（GitHub Pages 約需 30 秒完成部署）`;

        fetchCurrentApps();
      } catch (err) {
        status.textContent = `❌ 發生錯誤：${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }

    async function deleteApp(slug, appPath) {
      if (!confirm(`確定要從首頁及 GitHub 儲存庫中永久刪除「${slug}」嗎？`)) return;
      const { branch } = getConfig();
      try {
        // 1. 從 apps.json 移除
        const manifestFile = await getFileShaAndContent('apps.json');
        if (manifestFile.content) {
          let apps = JSON.parse(manifestFile.content).filter(a => a.slug !== slug);
          await putFile('apps.json', JSON.stringify(apps, null, 2), `Remove ${slug} from apps.json`);
        }
        // 2. 刪除實際 HTML 檔案
        const target = await getFileShaAndContent(appPath);
        if (target.sha) {
          await ghRequest(appPath, 'DELETE', {
            message: `Delete ${appPath}`,
            sha: target.sha,
            branch
          });
        }
        if (editingOriginalSlug === slug) resetForm();
        fetchCurrentApps();
      } catch (err) {
        alert('刪除失敗：' + err.message);
      }
    }

    async function fetchCurrentApps() {
      const cfg = getConfig();
      if (!cfg.owner || !cfg.repo || !cfg.token) return;
      const container = document.getElementById('adminAppsList');
      try {
        const manifestFile = await getFileShaAndContent('apps.json');
        cachedApps = manifestFile.content ? JSON.parse(manifestFile.content) : [];
        if (cachedApps.length === 0) {
          container.innerHTML = `<p class="text-slate-500 text-xs py-4">目前 apps.json 內未有任何應用程式。</p>`;
          return;
        }
        container.innerHTML = cachedApps.map(app => `
          <div class="py-3.5 flex items-center justify-between gap-4 flex-wrap">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-xl shrink-0">
                ${app.icon || '🚀'}
              </div>
              <div class="min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <a href="./${app.path}" target="_blank" class="font-medium text-slate-200 hover:text-indigo-400 truncate">
                    ${app.title}
                  </a>
                  <span class="text-[11px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
                    ${app.category || '一般'}
                  </span>
                </div>
                <p class="text-xs text-slate-400 truncate mt-0.5">${app.description || '無簡介'}</p>
                <p class="text-[11px] text-slate-500 mt-0.5">/${app.path} • ${app.date || ''}</p>
              </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <button
                onclick="startEditApp('${app.slug.replace(/'/g, "\\'")}')"
                class="text-xs px-3 py-1.5 rounded-lg bg-amber-500/15 hover:bg-amber-500/25 text-amber-300 border border-amber-500/30 transition"
              >
                ✏️ 編輯
              </button>
              <button
                onclick="deleteApp('${app.slug.replace(/'/g, "\\'")}', '${app.path.replace(/'/g, "\\'")}')"
                class="text-xs px-3 py-1.5 rounded-lg bg-rose-950/60 hover:bg-rose-900 text-rose-300 border border-rose-800/50 transition"
              >
                🗑️ 刪除
              </button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<p class="text-rose-400 text-xs py-4">無法讀取 apps.json：${err.message}</p>`;
      }
    }

    updateConfigUI();
    fetchCurrentApps();
  </script>
</body>
</html>
