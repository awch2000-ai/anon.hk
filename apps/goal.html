<!DOCTYPE html>
<html lang="zh-Hant" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 個人目標管理儀表板 | GoalFlow</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Inter & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* 自訂滾動條與微動畫 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-200 min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
                    <i data-lucide="target" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight leading-none">GoalFlow <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700 dark:bg-indigo-900/50 dark:text-indigo-300 ml-1">AI 版</span></h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 hidden sm:block" id="current-date-display">載入日期中...</p>
                </div>
            </div>

            <!-- 右側功能按鈕 -->
            <div class="flex items-center gap-2 sm:gap-3">
                <button onclick="exportData()" title="匯出 JSON 備份" class="flex items-center gap-1.5 px-3 py-2 text-xs sm:text-sm font-medium rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    <span class="hidden md:inline">匯出備份</span>
                </button>
                
                <label title="匯入 JSON 還原" class="flex items-center gap-1.5 px-3 py-2 text-xs sm:text-sm font-medium rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition cursor-pointer">
                    <i data-lucide="upload" class="w-4 h-4"></i>
                    <span class="hidden md:inline">匯入還原</span>
                    <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">
                </label>

                <button onclick="toggleDarkMode()" id="theme-toggle" title="切換深色/淺色模式" class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                    <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
                    <i data-lucide="sun" class="w-4 h-4 hidden dark:block text-amber-400"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 全域提示訊息 Toast -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- 主內容區 -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 space-y-6">

        <!-- 頂部數據摘要與視覺化圖表區 -->
        <section class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- 關鍵指標卡片 (左側 4 欄) -->
            <div class="lg:col-span-4 grid grid-cols-2 lg:grid-cols-1 gap-4">
                <div class="bg-white dark:bg-slate-800/90 rounded-2xl p-5 border border-slate-200/80 dark:border-slate-700/80 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs font-medium text-slate-500 dark:text-slate-400">進行中大目標</p>
                        <p class="text-2xl sm:text-3xl font-bold mt-1" id="stat-total-goals">0</p>
                        <p class="text-xs text-emerald-600 dark:text-emerald-400 mt-1 flex items-center gap-1">
                            <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>
                            <span id="stat-completed-subgoals">0/0 小目標完成</span>
                        </p>
                    </div>
                    <div class="w-12 h-12 rounded-2xl bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 flex items-center justify-center">
                        <i data-lucide="flag" class="w-6 h-6"></i>
                    </div>
                </div>

                <div class="bg-white dark:bg-slate-800/90 rounded-2xl p-5 border border-slate-200/80 dark:border-slate-700/80 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs font-medium text-slate-500 dark:text-slate-400">本週習慣達成率</p>
                        <p class="text-2xl sm:text-3xl font-bold mt-1" id="stat-habit-rate">0%</p>
                        <p class="text-xs text-amber-600 dark:text-amber-400 mt-1 flex items-center gap-1">
                            <i data-lucide="flame" class="w-3.5 h-3.5"></i>
                            <span id="stat-best-streak">最高連續 0 天</span>
                        </p>
                    </div>
                    <div class="w-12 h-12 rounded-2xl bg-amber-50 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400 flex items-center justify-center">
                        <i data-lucide="zap" class="w-6 h-6"></i>
                    </div>
                </div>
            </div>

            <!-- 整體達成率圓環圖 (中間 4 欄) -->
            <div class="lg:col-span-4 bg-white dark:bg-slate-800/90 rounded-2xl p-5 border border-slate-200/80 dark:border-slate-700/80 shadow-sm flex flex-col justify-between">
                <div class="flex items-center justify-between mb-2">
                    <h2 class="font-semibold text-sm text-slate-700 dark:text-slate-200">整體目標達成率</h2>
                    <span class="text-xs px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">即時計算</span>
                </div>
                <div class="relative h-44 flex items-center justify-center">
                    <canvas id="overallChart"></canvas>
                    <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                        <span class="text-2xl font-bold" id="overall-percentage-text">0%</span>
                        <span class="text-[11px] text-slate-400">總進度</span>
                    </div>
                </div>
            </div>

            <!-- 各領域進度分佈長條圖 (右側 4 欄) -->
            <div class="lg:col-span-4 bg-white dark:bg-slate-800/90 rounded-2xl p-5 border border-slate-200/80 dark:border-slate-700/80 shadow-sm flex flex-col justify-between">
                <div class="flex items-center justify-between mb-2">
                    <h2 class="font-semibold text-sm text-slate-700 dark:text-slate-200">各領域平均進度 (%)</h2>
                    <i data-lucide="bar-chart-2" class="w-4 h-4 text-slate-400"></i>
                </div>
                <div class="relative h-44 w-full">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </section>

        <!-- AI 智能目標拆解生成器 (核心亮點功能) -->
        <section class="bg-gradient-to-br from-indigo-50/90 via-white to-violet-50/90 dark:from-slate-800 dark:via-slate-800 dark:to-indigo-950/40 rounded-2xl p-5 sm:p-6 border border-indigo-200/80 dark:border-indigo-800/60 shadow-sm">
            <div class="flex items-center gap-2 mb-4">
                <span class="p-1.5 rounded-lg bg-indigo-600 text-white">
                    <i data-lucide="sparkles" class="w-4 h-4"></i>
                </span>
                <h2 class="font-bold text-base sm:text-lg text-slate-800 dark:text-white">AI 智能目標拆解器</h2>
                <span class="text-xs text-slate-500 dark:text-slate-400 hidden sm:inline">— 輸入你的大目標，讓 Gemini 自動規劃可執行的關鍵小目標</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-12 gap-3">
                <!-- 領域選擇 -->
                <div class="md:col-span-3">
                    <select id="ai-goal-category" class="w-full h-11 px-3.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                        <option value="健身與健康">💪 健身與健康</option>
                        <option value="技能與學習">📚 技能與學習</option>
                        <option value="財務與理財">💰 財務與理財</option>
                        <option value="個人專案">🚀 個人專案</option>
                        <option value="生活與習慣">🌱 生活與習慣</option>
                    </select>
                </div>

                <!-- 大目標輸入框 -->
                <div class="md:col-span-6">
                    <input type="text" id="ai-goal-input" placeholder="例如：三個月內減脂 5 公斤、半年內考過日文 N2..." 
                        onkeydown="if(event.key === 'Enter') generateSubgoalsWithAI()"
                        class="w-full h-11 px-4 rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                </div>

                <!-- AI 拆解按鈕 -->
                <div class="md:col-span-3 flex gap-2">
                    <button onclick="generateSubgoalsWithAI()" id="ai-generate-btn" class="flex-1 h-11 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-medium text-sm shadow-sm shadow-indigo-500/30 flex items-center justify-center gap-2 transition cursor-pointer">
                        <i data-lucide="wand-2" class="w-4 h-4"></i>
                        <span>AI 自動細化小目標</span>
                    </button>
                </div>
            </div>

            <!-- AI 生成結果預覽與微調區 (預設隱藏) -->
            <div id="ai-preview-box" class="hidden mt-5 pt-5 border-t border-indigo-200/60 dark:border-slate-700 fade-in">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-semibold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">AI 建議拆解方案</span>
                        <span class="text-xs text-slate-500 dark:text-slate-400">(你可以直接編輯文字或增減項目後再加入)</span>
                    </div>
                    <button onclick="addPreviewSubgoalRow()" class="text-xs font-medium text-indigo-600 dark:text-indigo-400 hover:underline flex items-center gap-1">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i> 新增一項
                    </button>
                </div>

                <div id="ai-preview-list" class="space-y-2 mb-4">
                    <!-- 動態生成的預覽小目標輸入框 -->
                </div>

                <div class="flex justify-end gap-2">
                    <button onclick="closeAiPreview()" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-700 transition">
                        取消
                    </button>
                    <button onclick="confirmAndAddAiGoal()" class="px-5 py-2 rounded-xl text-xs sm:text-sm font-medium bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm flex items-center gap-1.5 transition">
                        <i data-lucide="check" class="w-4 h-4"></i>
                        確認加入儀表板
                    </button>
                </div>
            </div>
        </section>

        <!-- 下半部雙欄佈局：左側 OKR 大目標列表，右側 每日習慣追蹤器 -->
        <section class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- 左側：大目標與細化小目標管理 (7 欄) -->
            <div class="lg:col-span-7 space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="font-bold text-lg flex items-center gap-2">
                        <i data-lucide="layers" class="w-5 h-5 text-indigo-500"></i>
                        大目標與關鍵小目標 (OKRs)
                    </h2>
                    <button onclick="openManualGoalModal()" class="text-xs sm:text-sm font-medium px-3 py-1.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition flex items-center gap-1.5">
                        <i data-lucide="plus" class="w-4 h-4"></i> 手動新增
                    </button>
                </div>

                <!-- 目標卡片容器 -->
                <div id="goals-container" class="space-y-4">
                    <!-- 由 JS 動態渲染 -->
                </div>
            </div>

            <!-- 右側：每日習慣追蹤器 (5 欄) -->
            <div class="lg:col-span-5 bg-white dark:bg-slate-800/90 rounded-2xl p-5 border border-slate-200/80 dark:border-slate-700/80 shadow-sm">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h2 class="font-bold text-lg flex items-center gap-2">
                            <i data-lucide="calendar-check" class="w-5 h-5 text-amber-500"></i>
                            每日習慣追蹤
                        </h2>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">點擊圓圈打卡，維持連續紀錄 (Streak)</p>
                    </div>
                </div>

                <!-- 新增習慣輸入列 -->
                <div class="flex gap-2 mb-4">
                    <input type="text" id="new-habit-input" placeholder="新增每日習慣 (如：閱讀 30 分鐘)..." 
                        onkeydown="if(event.key === 'Enter') addHabit()"
                        class="flex-1 h-9 px-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs sm:text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    <button onclick="addHabit()" class="h-9 px-3 rounded-xl bg-slate-800 dark:bg-indigo-600 text-white text-xs font-medium hover:opacity-90 transition flex items-center gap-1">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i> 新增
                    </button>
                </div>

                <!-- 習慣表格 -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-100 dark:border-slate-700/80 text-[11px] font-semibold text-slate-400 uppercase">
                                <th class="pb-2.5 pr-2">習慣項目</th>
                                <th class="pb-2.5 text-center w-7">一</th>
                                <th class="pb-2.5 text-center w-7">二</th>
                                <th class="pb-2.5 text-center w-7">三</th>
                                <th class="pb-2.5 text-center w-7">四</th>
                                <th class="pb-2.5 text-center w-7">五</th>
                                <th class="pb-2.5 text-center w-7">六</th>
                                <th class="pb-2.5 text-center w-7">日</th>
                                <th class="pb-2.5 text-right pl-2">連續</th>
                            </tr>
                        </thead>
                        <tbody id="habits-tbody" class="divide-y divide-slate-100 dark:divide-slate-700/50 text-sm">
                            <!-- 由 JS 動態渲染 -->
                        </tbody>
                    </table>
                </div>
            </div>

        </section>
    </main>

    <!-- 手動新增大目標 Modal -->
    <div id="manual-modal" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 border border-slate-200 dark:border-slate-700 shadow-xl fade-in">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-lg">手動新增大目標</h3>
                <button onclick="closeManualGoalModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">所屬領域</label>
                    <select id="manual-category" class="w-full h-10 px-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm outline-none">
                        <option value="健身與健康">💪 健身與健康</option>
                        <option value="技能與學習">📚 技能與學習</option>
                        <option value="財務與理財">💰 財務與理財</option>
                        <option value="個人專案">🚀 個人專案</option>
                        <option value="生活與習慣">🌱 生活與習慣</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">大目標名稱</label>
                    <input type="text" id="manual-title" placeholder="輸入大目標標題..." class="w-full h-10 px-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">初始小目標 (每行一項)</label>
                    <textarea id="manual-subgoals" rows="4" placeholder="小目標 1&#10;小目標 2&#10;小目標 3" class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm outline-none"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button onclick="closeManualGoalModal()" class="px-4 py-2 rounded-xl text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700">取消</button>
                    <button onclick="saveManualGoal()" class="px-4 py-2 rounded-xl text-sm font-medium bg-indigo-600 text-white hover:bg-indigo-700">建立目標</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 狀態管理與預設資料 (State Management)
        // ==========================================
        const STORAGE_KEY = 'goalflow_ai_dashboard_v1';
        const THEME_KEY = 'goalflow_theme';

        // 預設豐富範例資料，讓初次開啟即具備完整視覺效果
        const defaultData = {
            goals: [
                {
                    id: 'g-1',
                    title: '12 週體態雕塑與體能提升計畫',
                    category: '健身與健康',
                    expanded: true,
                    subgoals: [
                        { id: 'sg-101', title: '每週完成 4 次重量訓練（每次至少 45 分鐘）', completed: true },
                        { id: 'sg-102', title: '每日攝取體重 1.6 倍克數的優質蛋白質', completed: true },
                        { id: 'sg-103', title: '戒除含糖飲料，每日飲水量達 2500ml', completed: false },
                        { id: 'sg-104', title: '體脂率從 24% 降至 19%', completed: false }
                    ]
                },
                {
                    id: 'g-2',
                    title: '打造並上線第一個個人 SaaS 副業產品',
                    category: '個人專案',
                    expanded: true,
                    subgoals: [
                        { id: 'sg-201', title: '完成 10 位潛在用戶訪談並確認核心痛點', completed: true },
                        { id: 'sg-202', title: '使用 AI 工具在 2 週內完成 MVP 原型開發', completed: true },
                        { id: 'sg-203', title: '在社群平台發布展示影片並獲取首批 50 位測試用戶', completed: false }
                    ]
                },
                {
                    id: 'g-3',
                    title: '建立自動化被動投資與緊急預備金',
                    category: '財務與理財',
                    expanded: false,
                    subgoals: [
                        { id: 'sg-301', title: '每月發薪日自動轉帳 20% 薪資至高利活存帳戶', completed: true },
                        { id: 'sg-302', title: '完成市值型 ETF 定期定額券商設定', completed: false },
                        { id: 'sg-303', title: '檢視並取消 2 項非必要的每月訂閱服務', completed: false }
                    ]
                }
            ],
            habits: [
                { id: 'h-1', title: '閱讀非虛構書籍 30 分鐘', days: [true, true, true, true, false, false, false] },
                { id: 'h-2', title: '無糖飲食與喝水 2500ml', days: [true, true, false, true, true, false, false] },
                { id: 'h-3', title: '睡前 1 小時遠離手機螢幕', days: [true, false, true, true, false, false, false] },
                { id: 'h-4', title: '力量訓練 / 有氧 45 分鐘', days: [true, false, true, false, true, false, false] }
            ]
        };

        let appState = loadState();
        let overallChartInstance = null;
        let categoryChartInstance = null;

        // 載入 localStorage
        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    return JSON.parse(saved);
                }
            } catch (e) {
                console.error('讀取存檔失敗:', e);
            }
            return JSON.parse(JSON.stringify(defaultData));
        }

        // 儲存至 localStorage 並觸發全面重新渲染
        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            } catch (e) {
                showToast('儲存失敗，瀏覽器空間可能已滿', 'error');
            }
            renderAll();
        }

        // ==========================================
        // 2. Gemini AI 自動拆解大目標功能 (核心)
        // ==========================================
        async function generateSubgoalsWithAI() {
            const inputEl = document.getElementById('ai-goal-input');
            const categoryEl = document.getElementById('ai-goal-category');
            const btnEl = document.getElementById('ai-generate-btn');
            
            const bigGoal = inputEl.value.trim();
            const category = categoryEl.value;

            if (!bigGoal) {
                showToast('請先輸入一個你想達成的大目標！', 'warning');
                inputEl.focus();
                return;
            }

            // 設定 Loading 狀態
            const originalBtnHtml = btnEl.innerHTML;
            btnEl.disabled = true;
            btnEl.classList.add('opacity-75', 'cursor-not-allowed');
            btnEl.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>AI 思考拆解中...</span>`;
            lucide.createIcons();

            try {
                const apiKey = ""; // 執行環境會自動注入 API Key
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                const systemPrompt = `你是一位頂尖的目標管理教練與 OKR 專家。請將使用者輸入的「大目標」細化拆解為 3 到 5 個「具體、可衡量、可執行、有時限感 (SMART 原則)」的關鍵小目標 (Key Results)。請使用繁體中文回答，語氣簡潔有力、直接給出行動指標，不要包含多餘的編號前綴。`;
                
                const userQuery = `領域：${category}\n大目標：${bigGoal}\n請為這個大目標拆解出 3 到 5 個關鍵小目標。`;

                const payload = {
                    contents: [{ parts: [{ text: userQuery }] }],
                    systemInstruction: {
                        parts: [{ text: systemPrompt }]
                    },
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                subgoals: {
                                    type: "ARRAY",
                                    description: "3到5個具體可執行的關鍵小目標",
                                    items: { type: "STRING" }
                                }
                            },
                            required: ["subgoals"]
                        }
                    }
                };

                // 實作指數退避重試機制 (Exponential Backoff)
                let responseData = null;
                const delays = [1000, 2000, 4000];
                for (let attempt = 0; attempt <= delays.length; attempt++) {
                    try {
                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        responseData = await response.json();
                        break;
                    } catch (err) {
                        if (attempt === delays.length) throw err;
                        await new Promise(res => setTimeout(res, delays[attempt]));
                    }
                }

                const rawText = responseData?.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!rawText) throw new Error('AI 未回傳有效內容');

                const parsed = JSON.parse(rawText);
                const generatedList = parsed.subgoals || [];

                if (generatedList.length === 0) throw new Error('拆解結果為空');

                // 顯示預覽編輯區
                renderAiPreviewList(generatedList);
                showToast('✨ AI 已成功為你細化小目標！可微調後加入', 'success');

            } catch (error) {
                console.error('AI 拆解發生錯誤:', error);
                // 提供優雅的本地備援拆解建議，確保使用者體驗不中斷
                const fallbackSubgoals = [
                    `制定「${bigGoal}」的每週執行時間表與里程碑`,
                    `每週投入至少 3 小時專注推進核心任務`,
                    `完成階段性成果檢核並記錄遇到的阻礙與改進方式`
                ];
                renderAiPreviewList(fallbackSubgoals);
                showToast('已為你生成基礎拆解模板，你可以自由編輯調整', 'info');
            } finally {
                btnEl.disabled = false;
                btnEl.classList.remove('opacity-75', 'cursor-not-allowed');
                btnEl.innerHTML = originalBtnHtml;
                lucide.createIcons();
            }
        }

            const previewBox = document.getElementById('ai-preview-box');
            const listContainer = document.getElementById('ai-preview-list');

        function calculateHabitStreak(daysArray) {
            let maxStreak = 0;
            let current = 0;
            for (const done of daysArray) {
                if (done) {
                    current++;
                    if (current > maxStreak) maxStreak = current;
                } else {
                    current = 0;
                }
            }
            return maxStreak;
        }

                '技能與學習': 'bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300',
                '財務與理財': 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300',
                '個人專案': 'bg-purple-100 text-purple-700 dark:bg-purple-900/40 dark:text-purple-300',
                '生活與習慣': 'bg-rose-100 text-rose-700 dark:bg-rose-900/40 dark:text-rose-300'
            };
            return map[category] || 'bg-slate-100 text-slate-700 dark:bg-slate-700 dark:text-slate-300';
        }

        function calculateGoalProgress(goal) {
            if (!goal.subgoals || goal.subgoals.length === 0) return 0;
            const completed = goal.subgoals.filter(s => s.completed).length;
            return Math.round((completed / goal.subgoals.length) * 100);
        }

        function updateStatsAndCharts() {
            // 計算整體目標統計
            let totalSubgoals = 0;
            let completedSubgoals = 0;
            const categoryMap = {};

            appState.goals.forEach(g => {
                const total = g.subgoals.length;
                const done = g.subgoals.filter(s => s.completed).length;
                totalSubgoals += total;
                completedSubgoals += done;

                if (!categoryMap[g.category]) {
                    categoryMap[g.category] = { total: 0, done: 0 };
                }
                categoryMap[g.category].total += total;
                categoryMap[g.category].done += done;
            });

            const overallPct = totalSubgoals > 0 ? Math.round((completedSubgoals / totalSubgoals) * 100) : 0;

            // 計算習慣統計
            let totalHabitSlots = appState.habits.length * 7;
            let completedHabitSlots = 0;
            let bestStreak = 0;
            appState.habits.forEach(h => {
                completedHabitSlots += h.days.filter(Boolean).length;
                const s = calculateHabitStreak(h.days);
                if (s > bestStreak) bestStreak = s;
            });
            const habitRate = totalHabitSlots > 0 ? Math.round((completedHabitSlots / totalHabitSlots) * 100) : 0;

            // 更新 DOM 數字
            document.getElementById('stat-total-goals').textContent = appState.goals.length;
            document.getElementById('stat-completed-subgoals').textContent = `${completedSubgoals}/${totalSubgoals} 小目標完成`;
            document.getElementById('stat-habit-rate').textContent = `${habitRate}%`;
            document.getElementById('stat-best-streak').textContent = `最高連續 ${bestStreak} 天`;
            document.getElementById('overall-percentage-text').textContent = `${overallPct}%`;

            // 繪製/更新 Chart.js 圖表
            const isDark = document.documentElement.classList.contains('dark');
            const textColor = isDark ? '#94a3b8' : '#64748b';
            const gridColor = isDark ? 'rgba(51, 65, 85, 0.5)' : 'rgba(226, 232, 240, 0.8)';

            // 1. 圓環圖 (Overall Doughnut)
            const ctxOverall = document.getElementById('overallChart').getContext('2d');
            if (overallChartInstance) overallChartInstance.destroy();
            overallChartInstance = new Chart(ctxOverall, {
                type: 'doughnut',
                data: {
                    labels: ['已完成', '未完成'],
                    datasets: [{
                        data: [overallPct, 100 - overallPct],
                        backgroundColor: ['#6366f1', isDark ? '#334155' : '#e2e8f0'],
                        borderWidth: 0,
                        hoverOffset: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '76%',
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => ` ${ctx.label}: ${ctx.raw}%`
                            }
                        }
                    }
                }
            });

            // 2. 各領域長條圖 (Category Bar)
            const categories = Object.keys(categoryMap);
            const categoryPcts = categories.map(cat => {
                const item = categoryMap[cat];
                return item.total > 0 ? Math.round((item.done / item.total) * 100) : 0;
            });

            const ctxCategory = document.getElementById('categoryChart').getContext('2d');
            if (categoryChartInstance) categoryChartInstance.destroy();
            categoryChartInstance = new Chart(ctxCategory, {
                type: 'bar',
                data: {
                    labels: categories.length ? categories : ['尚無資料'],
                    datasets: [{
                        label: '完成率 (%)',
                        data: categoryPcts.length ? categoryPcts : [0],
                        backgroundColor: ['#10b981', '#6366f1', '#f59e0b', '#8b5cf6', '#ec4899'],
                        borderRadius: 6,
                        barThickness: 22
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: { color: textColor, font: { size: 11 } },
                            grid: { color: gridColor }
                        },
                        x: {
                            ticks: { color: textColor, font: { size: 11 } },
                            grid: { display: false }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        function renderAll() {
            renderGoals();
            renderHabits();
            updateStatsAndCharts();
            lucide.createIcons();
        }

        // ==========================================
        // 6. 備份匯出/匯入、深色模式與輔助工具
        // ==========================================
        function exportData() {
            const dataStr = JSON.stringify(appState, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const dateStr = new Date().toISOString().slice(0, 10);
            a.href = url;
            a.download = `goalflow-backup-${dateStr}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('已匯出 JSON 備份檔案', 'success');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported && Array.isArray(imported.goals) && Array.isArray(imported.habits)) {
                        appState = imported;
                        saveState();
                        showToast('資料還原成功！', 'success');
                    } else {
                        throw new Error('格式不符');
                    }
                } catch (err) {
                    showToast('匯入失敗：無效的備份檔案格式', 'error');
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            const isDark = html.classList.toggle('dark');
            localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
            updateStatsAndCharts();
        }

        function initThemeAndDate() {
            const savedTheme = localStorage.getItem(THEME_KEY);
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('current-date-display').textContent = now.toLocaleDateString('zh-TW', options);
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = {
                success: 'bg-emerald-600 text-white',
                warning: 'bg-amber-500 text-white',
                error: 'bg-rose-600 text-white',
                info: 'bg-slate-800 dark:bg-slate-700 text-white'
            };
            toast.className = `${colors[type] || colors.info} px-4 py-2.5 rounded-xl shadow-lg text-xs sm:text-sm font-medium fade-in flex items-center gap-2`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // 初始化啟動
        window.addEventListener('DOMContentLoaded', () => {
            initThemeAndDate();
            renderAll();
        });
    </script>
</body>
</html>
