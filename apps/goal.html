<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini 個人目標管理與智能拆解儀表板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #f8fafc;
    }
    .gradient-bg {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #ec4899 100%);
    }
    .card-shadow {
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06);
    }
    .checkbox-custom:checked + span {
      text-decoration: line-through;
      color: #94a3b8;
    }
  </style>
</head>
<body class="text-slate-800 min-h-screen pb-16">

  <!-- 頂部導覽列 -->
  <header class="gradient-bg text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="bg-white/20 p-3 rounded-xl backdrop-blur-sm">
          <i class="fa-solid fa-wand-magic-sparkles text-2xl"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight">Gemini 個人目標管理儀表板</h1>
          <p class="text-indigo-100 text-sm">輸入宏觀大目標，AI 自動為你細化為可執行的階段性小目標</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="toggleApiModal()" class="bg-white/15 hover:bg-white/25 text-white px-4 py-2 rounded-lg text-sm font-medium backdrop-blur-sm transition flex items-center gap-2 border border-white/20">
          <i class="fa-solid fa-key"></i>
          <span id="apiStatusText">設定 Gemini API Key (選填)</span>
        </button>
        <button onclick="resetDemoData()" class="bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-lg text-sm transition" title="載入範例目標">
          <i class="fa-solid fa-rotate-right"></i> 範例資料
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 space-y-8">

    <!-- KPI 數據統計列 -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
      <div class="bg-white p-5 rounded-2xl card-shadow border border-slate-100 flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">進行中大目標</p>
          <p id="statTotalGoals" class="text-3xl font-bold text-slate-800 mt-1">0</p>
        </div>
        <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl">
          <i class="fa-solid fa-bullseye"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl card-shadow border border-slate-100 flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">細化小目標總數</p>
          <p id="statTotalSubtasks" class="text-3xl font-bold text-slate-800 mt-1">0</p>
        </div>
        <div class="w-12 h-12 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-xl">
          <i class="fa-solid fa-list-check"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl card-shadow border border-slate-100 flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">已完成小目標</p>
          <p id="statCompletedSubtasks" class="text-3xl font-bold text-emerald-600 mt-1">0</p>
        </div>
        <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl">
          <i class="fa-solid fa-circle-check"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl card-shadow border border-slate-100 flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">整體平均達成率</p>
          <p id="statOverallProgress" class="text-3xl font-bold text-pink-600 mt-1">0%</p>
        </div>
        <div class="w-12 h-12 rounded-xl bg-pink-50 text-pink-600 flex items-center justify-center text-xl">
          <i class="fa-solid fa-chart-pie"></i>
        </div>
      </div>
    </section>

    <!-- AI 目標輸入與自動細化區 -->
    <section class="bg-white rounded-2xl card-shadow border border-indigo-100 p-6 sm:p-8 relative overflow-hidden">
      <div class="absolute top-0 right-0 w-64 h-64 bg-gradient-to-bl from-indigo-50 via-purple-50 to-transparent rounded-bl-full -z-10"></div>
      
      <div class="flex items-center gap-2 mb-4">
        <span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-indigo-100 text-indigo-700 flex items-center gap-1.5">
          <i class="fa-solid fa-bolt"></i> AI 目標拆解器
        </span>
        <h2 class="text-lg font-bold text-slate-800">新增大目標並自動細化</h2>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-end">
        <div class="lg:col-span-5">
          <label class="block text-sm font-medium text-slate-700 mb-1.5">你的大目標是什麼？</label>
          <input id="inputBigGoal" type="text" placeholder="例如：在 8 週內建立個人作品集網站、準備半程馬拉松..." 
            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition text-sm">
        </div>

        <div class="lg:col-span-2">
          <label class="block text-sm font-medium text-slate-700 mb-1.5">目標領域</label>
          <select id="inputCategory" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none text-sm bg-white">
            <option value="職涯與專案">💼 職涯與專案</option>
            <option value="學習與進修">📚 學習與進修</option>
            <option value="健康與運動">🏃 健康與運動</option>
            <option value="財務與理財">💰 財務與理財</option>
            <option value="生活與習慣">🌱 生活與習慣</option>
          </select>
        </div>

        <div class="lg:col-span-2">
          <label class="block text-sm font-medium text-slate-700 mb-1.5">預計完成週數</label>
          <select id="inputWeeks" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none text-sm bg-white">
            <option value="4">4 週（1 個月）</option>
            <option value="8" selected>8 週（2 個月）</option>
            <option value="12">12 週（1 季）</option>
            <option value="24">24 週（半年）</option>
          </select>
        </div>

        <div class="lg:col-span-3 flex gap-2">
          <button id="btnDecompose" onclick="handleCreateGoal(true)" 
            class="w-full gradient-bg hover:opacity-95 text-white font-semibold py-2.5 px-4 rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center gap-2 text-sm">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>AI 自動細化拆解</span>
          </button>
        </div>
      </div>

      <!-- 快速靈感標籤 -->
      <div class="mt-4 flex flex-wrap items-center gap-2 text-xs text-slate-500">
        <span>試試看點擊靈感：</span>
        <button onclick="fillPrompt('在 8 週內掌握 Python 自動化資料分析與視覺化', '學習與進修', '8')" class="px-2.5 py-1 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 rounded-lg transition">🐍 掌握 Python 資料分析</button>
        <button onclick="fillPrompt('規劃並完成新學期 AI 專題導向課程教材設計', '職涯與專案', '4')" class="px-2.5 py-1 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 rounded-lg transition">🎓 完成 AI 專題課程教材</button>
        <button onclick="fillPrompt('培養每週規律慢跑習慣並完成 10 公里路跑賽事', '健康與運動', '12')" class="px-2.5 py-1 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 rounded-lg transition">🏃 完成 10 公里路跑賽事</button>
      </div>
    </section>

    <!-- 篩選器與目標卡片列表 -->
    <section>
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
        <div class="flex items-center gap-2 overflow-x-auto pb-1">
          <button onclick="setFilter('ALL')" id="filter-ALL" class="px-4 py-1.5 rounded-full text-sm font-medium bg-indigo-600 text-white transition">全部目標</button>
          <button onclick="setFilter('職涯與專案')" id="filter-職涯與專案" class="px-4 py-1.5 rounded-full text-sm font-medium bg-white text-slate-600 hover:bg-slate-100 transition">💼 職涯與專案</button>
          <button onclick="setFilter('學習與進修')" id="filter-學習與進修" class="px-4 py-1.5 rounded-full text-sm font-medium bg-white text-slate-600 hover:bg-slate-100 transition">📚 學習與進修</button>
          <button onclick="setFilter('健康與運動')" id="filter-健康與運動" class="px-4 py-1.5 rounded-full text-sm font-medium bg-white text-slate-600 hover:bg-slate-100 transition">🏃 健康與運動</button>
          <button onclick="setFilter('財務與理財')" id="filter-財務與理財" class="px-4 py-1.5 rounded-full text-sm font-medium bg-white text-slate-600 hover:bg-slate-100 transition">💰 財務與理財</button>
          <button onclick="setFilter('生活與習慣')" id="filter-生活與習慣" class="px-4 py-1.5 rounded-full text-sm font-medium bg-white text-slate-600 hover:bg-slate-100 transition">🌱 生活與習慣</button>
        </div>
      </div>

      <!-- 目標卡片容器 -->
      <div id="goalsContainer" class="grid grid-cols-1 lg:grid-cols-2 gap-6"></div>
    </section>
  </main>

  <!-- API Key 設定彈窗 -->
  <div id="apiModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-key text-indigo-600"></i> 設定 Gemini API Key
        </h3>
        <button onclick="toggleApiModal()" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <p class="text-xs text-slate-500 leading-relaxed mb-4">
        輸入你的 Google AI Studio API Key 後，系統將直接呼叫 <code class="bg-slate-100 px-1.5 py-0.5 rounded text-indigo-600">gemini-2.5-flash</code> 為你進行客製化目標拆解。若留空，系統會使用內建的 SMART 智慧拆解模板。Key 僅儲存於你的瀏覽器 LocalStorage 中。
      </p>
      <input id="apiKeyInput" type="password" placeholder="AIzaSy..." 
        class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none text-sm mb-4">
      <div class="flex justify-end gap-2">
        <button onclick="clearApiKey()" class="px-4 py-2 rounded-xl text-sm text-slate-600 hover:bg-slate-100 transition">清除金鑰</button>
        <button onclick="saveApiKey()" class="px-5 py-2 rounded-xl text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white transition">儲存設定</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'gemini_personal_goals_v1';
    const API_KEY_STORAGE = 'gemini_dashboard_api_key';
    let currentFilter = 'ALL';
    let goals = [];

    // 預設範例資料
    const defaultGoals = [
      {
        id: 'goal-1',
        title: '在 8 週內掌握 Python 自動化資料分析與視覺化',
        category: '學習與進修',
        weeks: 8,
        createdAt: '2026-11-15',
        aiSummary: '透過「語法基礎 → Pandas 實戰清理 → 視覺化專題產出」三階段推進，每週投入約 4 小時實作。',
        subtasks: [
          { id: 'st-101', phase: '第一階段：基礎環境與核心語法 (第 1-2 週)', text: '安裝 Anaconda / VS Code 並熟悉 Jupyter Notebook 操作環境', done: true },
          { id: 'st-102', phase: '第一階段：基礎環境與核心語法 (第 1-2 週)', text: '完成 Python 資料結構（List, Dict）與函式練習題 20 題', done: true },
          { id: 'st-103', phase: '第二階段：資料處理與分析實戰 (第 3-5 週)', text: '學習使用 Pandas 讀取 CSV/Excel 並處理缺失值與重複資料', done: false },
          { id: 'st-104', phase: '第二階段：資料處理與分析實戰 (第 3-5 週)', text: '運用 GroupBy 與樞紐分析完成一份真實公開數據集統計', done: false },
          { id: 'st-105', phase: '第三階段：視覺化與自動化產出 (第 6-8 週)', text: '使用 Matplotlib / Seaborn 繪製 5 種核心統計圖表', done: false },
          { id: 'st-106', phase: '第三階段：視覺化與自動化產出 (第 6-8 週)', text: '撰寫自動化腳本：一鍵讀取原始報表並輸出分析摘要圖表', done: false }
        ]
      }
    ];

    // 初始化
    function init() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        goals = JSON.parse(saved);
      } else {
        goals = JSON.parse(JSON.stringify(defaultGoals));
        saveGoals();
      }
      updateApiButtonStatus();
      renderDashboard();
    }

    function saveGoals() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(goals));
      renderDashboard();
    }

    function resetDemoData() {
      goals = JSON.parse(JSON.stringify(defaultGoals));
      saveGoals();
    }

    function fillPrompt(title, category, weeks) {
      document.getElementById('inputBigGoal').value = title;
      document.getElementById('inputCategory').value = category;
      document.getElementById('inputWeeks').value = weeks;
    }

    // 呼叫 Gemini API 或使用智慧拆解模板
    async function decomposeGoalWithAI(title, category, weeks) {
      const apiKey = localStorage.getItem(API_KEY_STORAGE);
      const w1 = Math.max(1, Math.floor(weeks * 0.25));
      const w2 = Math.max(2, Math.floor(weeks * 0.7));

      if (apiKey && apiKey.trim() !== '') {
        try {
          const prompt = `你是一位專業的個人目標管理教練。使用者輸入了一個大目標：「${title}」（分類：${category}，預計完成時間：${weeks} 週）。
請幫他將這個大目標細化為 6 個具體、可衡量、可打勾執行的「小目標（subtasks）」，並分為三個階段（第一階段：準備與基礎、第二階段：核心執行與推進、第三階段：驗收與成果固化）。
請直接回傳 JSON 格式，格式如下：
{
  "aiSummary": "一句話總結這個目標的核心執行策略（45字以內）",
  "subtasks": [
    { "phase": "第一階段：準備與基礎 (第 1-${w1} 週)", "text": "具體行動步驟 1" },
    { "phase": "第一階段：準備與基礎 (第 1-${w1} 週)", "text": "具體行動步驟 2" },
    { "phase": "第二階段：核心執行 (第 ${w1+1}-${w2} 週)", "text": "具體行動步驟 3" },
    { "phase": "第二階段：核心執行 (第 ${w1+1}-${w2} 週)", "text": "具體行動步驟 4" },
    { "phase": "第三階段：驗收與優化 (第 ${w2+1}-${weeks} 週)", "text": "具體行動步驟 5" },
    { "phase": "第三階段：驗收與優化 (第 ${w2+1}-${weeks} 週)", "text": "具體行動步驟 6" }
  ]
}`;

          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey.trim()}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: "application/json" }
            })
          });

          if (response.ok) {
            const data = await response.json();
            const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (rawText) {
              const parsed = JSON.parse(rawText);
              return parsed;
            }
          }
        } catch (err) {
          console.warn('Gemini API 呼叫失敗，自動切換為內建智慧拆解引擎：', err);
        }
      }

      // 內建 SMART 智慧拆解引擎（免 API Key 備援）
      const p1 = `第一階段：規劃與基準建立 (第 1-${w1} 週)`;
      const p2 = `第二階段：核心執行與雙週檢核 (第 ${w1 + 1}-${w2} 週)`;
      const p3 = `第三階段：成果驗收與優化 (第 ${w2 + 1}-${weeks} 週)`;

      return {
        aiSummary: `採用 SMART 三階段推進法，將「${title}」拆解為 ${weeks} 週的可量化微習慣與里程碑。`,
        subtasks: [
          { phase: p1, text: `盤點「${title}」所需的工具、參考資源與現況基準值` },
          { phase: p1, text: `排定每週固定投入的專屬時段（建議每週至少 2-3 次，每次 60 分鐘）` },
          { phase: p2, text: `完成第一波核心練習或初版產出，建立最小可行成果（MVP）` },
          { phase: p2, text: `進行期中進度檢視：記錄遇到的瓶頸並微調下半場執行節奏` },
          { phase: p3, text: `完成最終目標整合測試或完整成果輸出，確保品質達標` },
          { phase: p3, text: `撰寫覆盤筆記並歸檔經驗，轉化為長期可複用的個人流程` }
        ]
      };
    }

    async function handleCreateGoal() {
      const inputEl = document.getElementById('inputBigGoal');
      const category = document.getElementById('inputCategory').value;
      const weeks = parseInt(document.getElementById('inputWeeks').value, 10);
      const title = inputEl.value.trim();

      if (!title) {
        inputEl.focus();
        inputEl.classList.add('ring-2', 'ring-pink-400');
        setTimeout(() => inputEl.classList.remove('ring-2', 'ring-pink-400'), 1500);
        return;
      }

      const btn = document.getElementById('btnDecompose');
      const originalHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>AI 正在拆解小目標...</span>`;

      const aiResult = await decomposeGoalWithAI(title, category, weeks);

      const newGoal = {
        id: 'goal-' + Date.now(),
        title,
        category,
        weeks,
        createdAt: new Date().toISOString().split('T')[0],
        aiSummary: aiResult.aiSummary,
        subtasks: (aiResult.subtasks || []).map((st, idx) => ({
          id: `st-${Date.now()}-${idx}`,
          phase: st.phase,
          text: st.text,
          done: false
        }))
      };

      goals.unshift(newGoal);
      inputEl.value = '';
      btn.disabled = false;
      btn.innerHTML = originalHtml;
      saveGoals();
    }

    function toggleSubtask(goalId, subtaskId) {
      const goal = goals.find(g => g.id === goalId);
      if (!goal) return;
      const st = goal.subtasks.find(s => s.id === subtaskId);
      if (st) {
        st.done = !st.done;
        saveGoals();
      }
    }

    function addManualSubtask(goalId) {
      const input = document.getElementById(`add-st-${goalId}`);
      if (!input || !input.value.trim()) return;
      const goal = goals.find(g => g.id === goalId);
      if (!goal) return;

      goal.subtasks.push({
        id: 'st-' + Date.now(),
        phase: '自訂補充行動',
        text: input.value.trim(),
        done: false
      });
      input.value = '';
      saveGoals();
    }

    function deleteSubtask(goalId, subtaskId) {
      const goal = goals.find(g => g.id === goalId);
      if (!goal) return;
      goal.subtasks = goal.subtasks.filter(s => s.id !== subtaskId);
      saveGoals();
    }

    function deleteGoal(goalId) {
      goals = goals.filter(g => g.id !== goalId);
      saveGoals();
    }

    function setFilter(cat) {
      currentFilter = cat;
      const categories = ['ALL', '職涯與專案', '學習與進修', '健康與運動', '財務與理財', '生活與習慣'];
      categories.forEach(c => {
        const btn = document.getElementById(`filter-${c}`);
        if (!btn) return;
        if (c === cat) {
          btn.className = 'px-4 py-1.5 rounded-full text-sm font-medium bg-indigo-600 text-white transition';
        } else {
          btn.className = 'px-4 py-1.5 rounded-full text-sm font-medium bg-white text-slate-600 hover:bg-slate-100 transition';
        }
      });
      renderDashboard();
    }

    function renderDashboard() {
      // 更新 KPI
      const totalGoals = goals.length;
      let totalSubtasks = 0;
      let completedSubtasks = 0;

      goals.forEach(g => {
        totalSubtasks += g.subtasks.length;
        completedSubtasks += g.subtasks.filter(s => s.done).length;
      });

      const overallProgress = totalSubtasks === 0 ? 0 : Math.round((completedSubtasks / totalSubtasks) * 100);

      document.getElementById('statTotalGoals').textContent = totalGoals;
      document.getElementById('statTotalSubtasks').textContent = totalSubtasks;
      document.getElementById('statCompletedSubtasks').textContent = completedSubtasks;
      document.getElementById('statOverallProgress').textContent = `${overallProgress}%`;

      // 渲染目標列表
      const container = document.getElementById('goalsContainer');
      const filtered = currentFilter === 'ALL' ? goals : goals.filter(g => g.category === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full bg-white rounded-2xl p-12 text-center border border-dashed border-slate-200">
            <div class="w-16 h-16 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
              <i class="fa-solid fa-seedling"></i>
            </div>
            <h3 class="text-base font-bold text-slate-700">目前還沒有目標卡片</h3>
            <p class="text-sm text-slate-400 mt-1">在上方輸入一個大目標，讓 Gemini 幫你自動細化成小目標吧！</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(goal => {
        const total = goal.subtasks.length;
        const doneCount = goal.subtasks.filter(s => s.done).length;
        const pct = total === 0 ? 0 : Math.round((doneCount / total) * 100);

        // 依階段分組顯示
        const grouped = {};
        goal.subtasks.forEach(st => {
          const phaseName = st.phase || '行動清單';
          if (!grouped[phaseName]) grouped[phaseName] = [];
          grouped[phaseName].push(st);
        });

        const phasesHtml = Object.keys(grouped).map(phase => `
          <div class="mb-4 last:mb-0">
            <h4 class="text-xs font-bold text-indigo-600 uppercase tracking-wider mb-2 flex items-center gap-1.5">
              <i class="fa-solid fa-layer-group text-[10px]"></i> ${phase}
            </h4>
            <div class="space-y-2">
              ${grouped[phase].map(st => `
                <div class="flex items-start justify-between gap-2 p-2.5 rounded-xl bg-slate-50 hover:bg-slate-100/80 transition group">
                  <label class="flex items-start gap-3 cursor-pointer flex-1 text-sm">
                    <input type="checkbox" ${st.done ? 'checked' : ''} onchange="toggleSubtask('${goal.id}', '${st.id}')"
                      class="checkbox-custom mt-1 w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                    <span class="text-slate-700 leading-snug">${st.text}</span>
                  </label>
                  <button onclick="deleteSubtask('${goal.id}', '${st.id}')" class="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-rose-500 transition px-1" title="刪除此小目標">
                    <i class="fa-solid fa-trash-can text-xs"></i>
                  </button>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('');

        return `
          <div class="bg-white rounded-2xl card-shadow border border-slate-100 p-6 flex flex-col justify-between">
            <div>
              <!-- 卡片頂部資訊 -->
              <div class="flex items-start justify-between gap-3 mb-3">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-indigo-50 text-indigo-700">${goal.category}</span>
                  <span class="px-2.5 py-1 rounded-lg text-xs font-medium bg-slate-100 text-slate-600">
                    <i class="fa-regular fa-clock mr-1"></i>${goal.weeks} 週計畫
                  </span>
                </div>
                <button onclick="deleteGoal('${goal.id}')" class="text-slate-300 hover:text-rose-500 transition" title="刪除整個目標">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>

              <!-- 大目標標題與 AI 策略摘要 -->
              <h3 class="text-lg font-bold text-slate-800 mb-2">${goal.title}</h3>
              <p class="text-xs text-slate-500 bg-indigo-50/60 border border-indigo-100/80 rounded-xl p-3 mb-4 flex items-start gap-2">
                <i class="fa-solid fa-robot text-indigo-500 mt-0.5"></i>
                <span>${goal.aiSummary}</span>
              </p>

              <!-- 進度條 -->
              <div class="mb-5">
                <div class="flex justify-between text-xs font-semibold mb-1.5">
                  <span class="text-slate-600">執行進度 (${doneCount} / ${total} 完成)</span>
                  <span class="${pct === 100 ? 'text-emerald-600' : 'text-indigo-600'}">${pct}%</span>
                </div>
                <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
                  <div class="h-full transition-all duration-500 rounded-full ${pct === 100 ? 'bg-emerald-500' : 'gradient-bg'}" style="width: ${pct}%"></div>
                </div>
              </div>

              <!-- 階段性小目標清單 -->
              <div class="border-t border-slate-100 pt-4">
                ${phasesHtml}
              </div>
            </div>

            <!-- 手動追加小目標 -->
            <div class="mt-5 pt-3 border-t border-slate-100 flex gap-2">
              <input id="add-st-${goal.id}" type="text" placeholder="手動新增其他小目標..." 
                onkeydown="if(event.key==='Enter') addManualSubtask('${goal.id}')"
                class="flex-1 px-3 py-2 rounded-xl border border-slate-200 text-xs focus:border-indigo-500 outline-none">
              <button onclick="addManualSubtask('${goal.id}')" class="px-3 py-2 bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-600 rounded-xl text-xs font-medium transition">
                <i class="fa-solid fa-plus"></i> 新增
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // API Key 管理
    function toggleApiModal() {
      const modal = document.getElementById('apiModal');
      const isHidden = modal.classList.contains('hidden');
      if (isHidden) {
        document.getElementById('apiKeyInput').value = localStorage.getItem(API_KEY_STORAGE) || '';
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      } else {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    function saveApiKey() {
      const val = document.getElementById('apiKeyInput').value.trim();
      if (val) {
        localStorage.setItem(API_KEY_STORAGE, val);
      } else {
        localStorage.removeItem(API_KEY_STORAGE);
      }
      updateApiButtonStatus();
      toggleApiModal();
    }

    function clearApiKey() {
      localStorage.removeItem(API_KEY_STORAGE);
      document.getElementById('apiKeyInput').value = '';
      updateApiButtonStatus();
      toggleApiModal();
    }

    function updateApiButtonStatus() {
      const hasKey = !!localStorage.getItem(API_KEY_STORAGE);
      const statusText = document.getElementById('apiStatusText');
      if (hasKey) {
        statusText.textContent = '已連結 Gemini API ✓';
      } else {
        statusText.textContent = '設定 Gemini API Key (選填)';
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
