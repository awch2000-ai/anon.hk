<!DOCTYPE html>
<html lang="zh-HK" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>健身追蹤器</title>
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 載入 Google Fonts (Inter + Noto Sans TC) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
          },
          colors: {
            slateBg: '#0B1120',
            slateCard: '#151F32',
            slateElevated: '#1E293B',
            emeraldAccent: '#10B981',
            electricBlue: '#38BDF8',
            amberPosture: '#F59E0B',
          },
          animation: {
            'pop': 'pop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
            'flash-border': 'flashBorder 0.6s ease-in-out 4',
          },
          keyframes: {
            pop: {
              '0%': { transform: 'scale(0.92)' },
              '50%': { transform: 'scale(1.04)' },
              '100%': { transform: 'scale(1)' },
            },
            flashBorder: {
              '0%, 100%': { borderColor: '#38BDF8', boxShadow: '0 0 0 0 rgba(56, 189, 248, 0)' },
              '50%': { borderColor: '#10B981', boxShadow: '0 0 24px 4px rgba(16, 185, 129, 0.55)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    /* 隱藏橫向滾動條但保留流暢滑動體驗 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* 防止手機雙擊縮放與改善點擊回饋 */
    * {
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0B1120;
      color: #F8FAFC;
      overscroll-behavior-y: contain;
    }
    /* 折疊面板平滑過渡 */
    .accordion-content {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .accordion-content.open {
      grid-template-rows: 1fr;
    }
    .accordion-inner {
      overflow: hidden;
    }
  </style>
</head>
<body class="min-h-screen bg-[#0B1120] text-slate-100 font-sans antialiased selection:bg-emerald-500/30 selection:text-emerald-200">

  <!-- 頂部固定導覽與進度儀表板 (Sticky Header) -->
  <header class="sticky top-0 z-40 bg-[#0B1120]/95 backdrop-blur-md border-b border-slate-800/90 shadow-lg">
    <div class="max-w-xl mx-auto px-4 pt-3 pb-2.5">
      <!-- 標題列與重置按鈕 -->
      <div class="flex items-center justify-between gap-2 mb-2.5">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500 to-sky-500 flex items-center justify-center shadow-md shadow-emerald-500/20 shrink-0">
            <!-- 啞鈴圖示 SVG -->
            <svg class="w-5 h-5 text-slate-950" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6.5 6.5v11M17.5 6.5v11M3.5 8.5v7M20.5 8.5v7M6.5 12h11" />
            </svg>
          </div>
        </div>

        <!-- 重置本週進度按鈕 -->
        <button id="openResetModalBtn" type="button" class="shrink-0 min-h-[40px] px-3 py-1.5 rounded-xl bg-slate-800/90 hover:bg-slate-700 active:scale-95 border border-slate-700 text-xs font-semibold text-slate-300 flex items-center gap-1.5 transition">
          <svg class="w-3.5 h-3.5 text-rose-400" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span>重置本週</span>
        </button>
      </div>

      <!-- Day 1 - Day 7 橫向滑動分頁切換器 -->
      <nav id="dayTabsContainer" aria-label="訓練日切換" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1 scroll-smooth">
        <!-- 由 JS 動態生成 Day 1 - Day 7 按鈕 -->
      </nav>

      <!-- 當日主題、主攻目標與完成進度條 -->
      <div class="mt-2.5 bg-[#151F32] rounded-2xl p-3 border border-slate-800/90">
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <h2 id="dayTitle" class="text-sm sm:text-base font-extrabold text-white leading-snug">Day 1：上半身「推」A</h2>
            </div>
            <p id="dayFocus" class="text-xs text-amber-400 font-medium mt-0.5 flex items-center gap-1">
              <span>🎯</span>
              <span id="dayFocusText">主攻：改善圓肩、撐起上胸鎖骨</span>
            </p>
          </div>
          <div class="text-right shrink-0">
            <span id="progressText" class="text-xs font-bold text-emerald-400 bg-emerald-500/10 border border-emerald-500/25 px-2.5 py-1 rounded-lg inline-block">
              已完成 0 / 16 組 · 0%
            </span>
          </div>
        </div>
        <!-- 視覺化進度條 -->
        <div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden mt-2.5 p-0.5">
          <div id="progressBar" class="h-full bg-gradient-to-r from-sky-400 to-emerald-400 rounded-full transition-all duration-300 ease-out" style="width: 0%"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- 主訓練內容清單區 (底部預留足夠空間避免被懸浮計時器遮擋) -->
  <main id="workoutContainer" class="max-w-xl mx-auto px-4 pt-4 pb-36 space-y-4">
    <!-- 由 JS 動態渲染動作卡片 -->
  </main>

  <!-- 底部懸浮 60 秒組間休息計時器 (Bottom Sticky Bar) -->
  <div id="timerBar" class="fixed bottom-0 inset-x-0 z-40 bg-[#0F172A]/95 backdrop-blur-lg border-t-2 border-slate-800 shadow-[0_-8px_30px_rgba(0,0,0,0.65)] transition-colors duration-300">
    <div class="max-w-xl mx-auto px-4 py-2.5">
      <div class="flex items-center justify-between gap-2">
        <!-- 左側：倒數狀態與大字體時間 -->
        <div class="flex items-center gap-3">
          <div id="timerStatusDot" class="w-3 h-3 rounded-full bg-slate-600 transition-colors"></div>
          <div>
            <div class="flex items-baseline gap-1.5">
              <span id="timerDisplay" class="text-2xl sm:text-3xl font-black tracking-tight tabular-nums text-white">01:00</span>
              <span id="timerLabel" class="text-[11px] font-semibold text-slate-400">組間休息待命</span>
            </div>
            <!-- 細進度條 -->
            <div class="w-24 sm:w-28 h-1 bg-slate-800 rounded-full overflow-hidden mt-1">
              <div id="timerProgressLine" class="h-full bg-sky-400 transition-all duration-200" style="width: 100%"></div>
            </div>
          </div>
        </div>

        <!-- 右側：大型單手觸控控制按鈕 -->
        <div class="flex items-center gap-1.5 sm:gap-2">
          <button id="timerToggleBtn" type="button" class="min-h-[44px] px-3.5 sm:px-4 rounded-xl bg-sky-500 hover:bg-sky-400 active:scale-95 text-slate-950 font-extrabold text-xs sm:text-sm flex items-center gap-1 shadow-md shadow-sky-500/20 transition">
            <span id="timerToggleIcon">▶</span>
            <span id="timerToggleText">開始</span>
          </button>
          <button id="timerAdd15Btn" type="button" class="min-h-[44px] px-3 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 text-emerald-400 font-bold text-xs sm:text-sm transition">
            +15s
          </button>
          <button id="timerResetBtn" type="button" class="min-h-[44px] px-3 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 text-slate-300 font-bold text-xs sm:text-sm transition">
            重設 60s
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 二次確認重置視窗 (Custom Modal，絕不使用 window.confirm) -->
  <div id="resetModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
    <div class="bg-[#151F32] border border-slate-700 rounded-2xl max-w-sm w-full p-5 shadow-2xl animate-pop">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-10 h-10 rounded-xl bg-rose-500/15 border border-rose-500/30 flex items-center justify-center text-rose-400 shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        </div>
        <div>
          <h3 class="text-base font-extrabold text-white">重置本週訓練進度</h3>
          <p class="text-xs text-slate-400 mt-0.5">請選擇您要執行的重置方式：</p>
        </div>
      </div>

      <div class="space-y-2.5 mt-4">
        <button id="resetChecksOnlyBtn" type="button" class="w-full min-h-[48px] px-4 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 active:scale-[0.99] text-slate-950 font-extrabold text-sm text-left flex items-center justify-between transition">
          <div>
            <div>只清除本週打勾進度</div>
            <div class="text-[11px] font-semibold text-slate-900/80">保留所有重量、格數與單車阻力紀錄（推薦）</div>
          </div>
          <span>→</span>
        </button>

        <button id="resetAllDataBtn" type="button" class="w-full min-h-[48px] px-4 py-2.5 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 active:scale-[0.99] border border-rose-500/40 text-rose-300 font-bold text-sm text-left flex items-center justify-between transition">
          <div>
            <div>全部重置（含重量紀錄）</div>
            <div class="text-[11px] font-normal text-rose-300/75">清空 Day 1 至 Day 7 所有勾選與輸入數值</div>
          </div>
          <span>→</span>
        </button>

        <button id="closeResetModalBtn" type="button" class="w-full min-h-[44px] mt-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-sm transition">
          取消返回
        </button>
      </div>
    </div>
  </div>

  <!-- Toast 輕提示訊息 -->
  <div id="toastMsg" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-200">
    <div class="bg-slate-900/95 border border-emerald-500/40 text-emerald-300 text-xs font-bold px-4 py-2 rounded-full shadow-xl flex items-center gap-2">
      <span>✓</span>
      <span id="toastText">已重置本週進度</span>
    </div>
  </div>

  <script>

    /**
     * =========================================================================
     * 2. 狀態管理與 localStorage 持久化
     * =========================================================================
     */
    const STORAGE_KEY = 'man_tung_road_gym_tracker_v1';

    // 預設狀態結構
    let appState = {
      activeDay: 1,
      checks: {},   // 例如: { "d1_e1_0": true, "d1_e1_1": true }
      weights: {},  // 例如: { "d1_e1": "25kg / 第4格" }
      expanded: {}  // 記錄折疊面板展開狀態（重新整理不強迫儲存亦可，這裡存於記憶體）
    };

    // 從 localStorage 讀取
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          appState.activeDay = parsed.activeDay || 1;
          appState.checks = parsed.checks || {};
          appState.weights = parsed.weights || {};
        }
      } catch (err) {
        console.warn('讀取 localStorage 失敗，使用預設狀態:', err);
      }
    }

    // 儲存至 localStorage
    function saveState() {
      try {
        const payload = {
          activeDay: appState.activeDay,
          checks: appState.checks,
          weights: appState.weights
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (err) {
        console.warn('儲存 localStorage 失敗:', err);
      }
    }

    /**
     * =========================================================================
     * 3. Web Audio API 內建合成提示音與震動提醒（免外部音檔）
     * =========================================================================
     */
    let audioCtx = null;

    function initAudioContext() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        // 忽略不支援音訊的環境
      }
    }

    // 播放清脆提示音（freq: 頻率Hz, duration: 秒, delay: 延遲秒）
    function playBeep(freq = 880, duration = 0.14, delay = 0, gainVal = 0.22) {
      try {
        initAudioContext();
        if (!audioCtx) return;

        const now = audioCtx.currentTime + delay;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(gainVal, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + duration + 0.02);
      } catch (e) {
        // 靜音環境安全降級
      }
    }

    // 倒數結束雙響提示＋手機震動＋視覺閃動
    function triggerTimerFinishAlert() {
      playBeep(880, 0.16, 0, 0.28);
      playBeep(1174.66, 0.28, 0.2, 0.32); // D6 清脆雙響
      if (navigator.vibrate) {
        try {
          navigator.vibrate([200, 100, 250]);
        } catch (e) {}
      }
      const timerBar = document.getElementById('timerBar');
      timerBar.classList.remove('animate-flash-border');
      void timerBar.offsetWidth; // 觸發重繪以重新播放動畫
      timerBar.classList.add('animate-flash-border');
    }

    /**
     * =========================================================================
     * 4. 底部懸浮 60 秒組間休息計時器邏輯
     * =========================================================================
     */
    const DEFAULT_REST_SECONDS = 60;
    let timerTotal = DEFAULT_REST_SECONDS;
    let timerRemaining = DEFAULT_REST_SECONDS;
    let timerInterval = null;
    let isTimerRunning = false;

    const timerDisplayEl = document.getElementById('timerDisplay');
    const timerLabelEl = document.getElementById('timerLabel');
    const timerStatusDotEl = document.getElementById('timerStatusDot');
    const timerProgressLineEl = document.getElementById('timerProgressLine');
    const timerToggleBtn = document.getElementById('timerToggleBtn');
    const timerToggleIcon = document.getElementById('timerToggleIcon');
    const timerToggleText = document.getElementById('timerToggleText');
    const timerAdd15Btn = document.getElementById('timerAdd15Btn');
    const timerResetBtn = document.getElementById('timerResetBtn');

    function formatSeconds(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function updateTimerUI() {
      timerDisplayEl.textContent = formatSeconds(timerRemaining);
      const pct = Math.max(0, Math.min(100, (timerRemaining / timerTotal) * 100));
      timerProgressLineEl.style.width = `${pct}%`;

      if (isTimerRunning) {
        timerToggleIcon.textContent = '⏸';
        timerToggleText.textContent = '暫停';
        timerToggleBtn.className = 'min-h-[44px] px-3.5 sm:px-4 rounded-xl bg-amber-400 hover:bg-amber-300 active:scale-95 text-slate-950 font-extrabold text-xs sm:text-sm flex items-center gap-1 shadow-md shadow-amber-500/20 transition';
        timerStatusDotEl.className = 'w-3 h-3 rounded-full bg-emerald-400 animate-ping';
        timerLabelEl.textContent = '組間休息倒數中...';
        timerLabelEl.className = 'text-[11px] font-bold text-emerald-400';
        timerDisplayEl.className = timerRemaining <= 5
          ? 'text-2xl sm:text-3xl font-black tracking-tight tabular-nums text-amber-400'
          : 'text-2xl sm:text-3xl font-black tracking-tight tabular-nums text-white';
      } else {
        timerToggleIcon.textContent = '▶';
        timerToggleText.textContent = timerRemaining === 0 ? '重來' : '開始';
        timerToggleBtn.className = 'min-h-[44px] px-3.5 sm:px-4 rounded-xl bg-sky-500 hover:bg-sky-400 active:scale-95 text-slate-950 font-extrabold text-xs sm:text-sm flex items-center gap-1 shadow-md shadow-sky-500/20 transition';
        timerStatusDotEl.className = timerRemaining === 0
          ? 'w-3 h-3 rounded-full bg-emerald-400'
          : 'w-3 h-3 rounded-full bg-slate-600';
        timerLabelEl.textContent = timerRemaining === 0 ? '休息結束！準備下一組' : '組間休息待命';
        timerLabelEl.className = timerRemaining === 0
          ? 'text-[11px] font-extrabold text-emerald-400'
          : 'text-[11px] font-semibold text-slate-400';
        timerDisplayEl.className = timerRemaining === 0
          ? 'text-2xl sm:text-3xl font-black tracking-tight tabular-nums text-emerald-400'
          : 'text-2xl sm:text-3xl font-black tracking-tight tabular-nums text-white';
      }
    }

    function startRestTimer(seconds = DEFAULT_REST_SECONDS) {
      initAudioContext();
      clearInterval(timerInterval);
      timerTotal = seconds;
      timerRemaining = seconds;
      isTimerRunning = true;
      updateTimerUI();

      timerInterval = setInterval(() => {
        if (timerRemaining > 0) {
          timerRemaining -= 1;
          // 最後 3、2、1 秒輕聲提示
          if (timerRemaining > 0 && timerRemaining <= 3) {
            playBeep(660, 0.08, 0, 0.14);
          }
          if (timerRemaining === 0) {
            clearInterval(timerInterval);
            isTimerRunning = false;
            triggerTimerFinishAlert();
          }
          updateTimerUI();
        }
      }, 1000);
    }

    function toggleTimer() {
      initAudioContext();
      if (isTimerRunning) {
        clearInterval(timerInterval);
        isTimerRunning = false;
        updateTimerUI();
      } else {
        if (timerRemaining <= 0) {
          startRestTimer(DEFAULT_REST_SECONDS);
          return;
        }
        isTimerRunning = true;
        updateTimerUI();
        timerInterval = setInterval(() => {
          if (timerRemaining > 0) {
            timerRemaining -= 1;
            if (timerRemaining > 0 && timerRemaining <= 3) {
              playBeep(660, 0.08, 0, 0.14);
            }
            if (timerRemaining === 0) {
              clearInterval(timerInterval);
              isTimerRunning = false;
              triggerTimerFinishAlert();
            }
            updateTimerUI();
          }
        }, 1000);
      }
    }

    function add15Seconds() {
      initAudioContext();
      timerRemaining += 15;
      if (timerRemaining > timerTotal) {
        timerTotal = timerRemaining;
      }
      updateTimerUI();
    }

    function resetTimerTo60() {
      clearInterval(timerInterval);
      isTimerRunning = false;
      timerTotal = DEFAULT_REST_SECONDS;
      timerRemaining = DEFAULT_REST_SECONDS;
      updateTimerUI();
    }

    timerToggleBtn.addEventListener('click', toggleTimer);
    timerAdd15Btn.addEventListener('click', add15Seconds);
    timerResetBtn.addEventListener('click', resetTimerTo60);

    /**
     * =========================================================================
     * 5. 進度計算與 UI 渲染引擎
     * =========================================================================
     */
    function getDayProgress(dayObj) {
      let totalSets = 0;
      let completedSets = 0;
      dayObj.exercises.forEach(ex => {
        totalSets += ex.sets;
        for (let i = 0; i < ex.sets; i++) {
          if (appState.checks[`${ex.id}_${i}`]) {
            completedSets += 1;
          }
        }
      });
      const percentage = totalSets > 0 ? Math.round((completedSets / totalSets) * 100) : 0;
      return { completedSets, totalSets, percentage };
    }

    // 渲染頂部 Day 1 - Day 7 橫向分頁
    function renderDayTabs() {
      const container = document.getElementById('dayTabsContainer');
      container.innerHTML = '';

      WORKOUT_PLAN.forEach(dayObj => {
        const isActive = dayObj.day === appState.activeDay;
        const { completedSets, totalSets, percentage } = getDayProgress(dayObj);
        const isDayDone = totalSets > 0 && completedSets === totalSets;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.day = dayObj.day;
        btn.className = isActive
          ? 'shrink-0 min-h-[44px] px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-sky-500 to-emerald-500 text-slate-950 font-extrabold text-xs sm:text-sm shadow-md shadow-sky-500/20 flex items-center gap-1.5 transition'
          : 'shrink-0 min-h-[44px] px-3.5 py-1.5 rounded-xl bg-[#151F32] hover:bg-slate-800 border border-slate-800 text-slate-300 font-bold text-xs sm:text-sm flex items-center gap-1.5 transition';

        // 狀態小點或完成打勾
        let statusBadge = '';
        if (isDayDone) {
          statusBadge = `<span class="inline-flex items-center justify-center w-4 h-4 rounded-full ${isActive ? 'bg-slate-950 text-emerald-400' : 'bg-emerald-500/20 text-emerald-400'} text-[10px] font-black">✓</span>`;
        } else if (completedSets > 0) {
          statusBadge = `<span class="w-2 h-2 rounded-full ${isActive ? 'bg-slate-950' : 'bg-amber-400'}"></span>`;
        }

        btn.innerHTML = `
          <span>${dayObj.shortTitle}</span>
          <span class="text-[11px] ${isActive ? 'text-slate-900/85 font-bold' : 'text-slate-400 font-medium'}">${dayObj.tag}</span>
          ${statusBadge}
        `;

        btn.addEventListener('click', () => {
          appState.activeDay = dayObj.day;
          saveState();
          renderAll();
          // 自動將點擊的分頁滾動至視窗中央
          btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        });

        container.appendChild(btn);
      });
    }

    // 更新頂部進度條與標題
    function updateHeaderDashboard() {
      const currentDayObj = WORKOUT_PLAN.find(d => d.day === appState.activeDay) || WORKOUT_PLAN[0];
      const { completedSets, totalSets, percentage } = getDayProgress(currentDayObj);

      document.getElementById('dayTitle').textContent = currentDayObj.title;
      document.getElementById('dayFocusText').textContent = currentDayObj.focus;
      document.getElementById('progressText').textContent = `已完成 ${completedSets} / ${totalSets} 組 · ${percentage}%`;
      document.getElementById('progressBar').style.width = `${percentage}%`;
    }

    // 渲染當日所有訓練動作卡片
    function renderWorkoutCards() {
      const container = document.getElementById('workoutContainer');
      const currentDayObj = WORKOUT_PLAN.find(d => d.day === appState.activeDay) || WORKOUT_PLAN[0];
      container.innerHTML = '';

      // 若為休息日，頂部加上溫馨修復提示橫幅
      if (currentDayObj.isRestDay) {
        const restBanner = document.createElement('div');
        restBanner.className = 'bg-gradient-to-r from-emerald-500/15 via-sky-500/10 to-slate-900 border border-emerald-500/30 rounded-2xl p-4 flex items-start gap-3';
        restBanner.innerHTML = `
          <div class="w-9 h-9 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center shrink-0 text-lg">🌿</div>
          <div>
            <h3 class="text-sm font-extrabold text-emerald-300">主動恢復與體態重塑日</h3>
            <p class="text-xs text-slate-300 leading-relaxed mt-1">
              無需進行大重量訓練。如當日經過東涌文東路體育館，可使用場內 <span class="text-sky-400 font-bold">拉筋機</span> 放鬆胸背與髖部；或依下方清單在家伸展，配合 7–8 小時充足睡眠。
            </p>
          </div>
        `;
        container.appendChild(restBanner);
      }

      currentDayObj.exercises.forEach((ex, index) => {
        const isCardio = ex.type === 'cardio';
        const savedWeight = appState.weights[ex.id] || '';
        const isExpanded = !!appState.expanded[ex.id];

        // 檢查該動作是否全部完成
        let exCompletedCount = 0;
        for (let s = 0; s < ex.sets; s++) {
          if (appState.checks[`${ex.id}_${s}`]) exCompletedCount++;
        }
        const isExAllDone = exCompletedCount === ex.sets;

        const card = document.createElement('article');
        card.className = `rounded-2xl border transition-all duration-200 ${
          isExAllDone
            ? 'bg-[#13232C] border-emerald-500/45 shadow-lg shadow-emerald-950/30'
            : 'bg-[#151F32] border-slate-800 shadow-md'
        }`;

        // 構建組數打勾按鈕 HTML
        let setsHtml = '';
        if (isCardio) {
          const checkKey = `${ex.id}_0`;
          const isChecked = !!appState.checks[checkKey];
          const btnLabel = currentDayObj.isRestDay ? '完成此項伸展／修復' : '完成有氧訓練';
          setsHtml = `
            <button type="button" data-check-key="${checkKey}" data-ex-type="cardio"
              class="set-check-btn w-full min-h-[48px] px-4 py-2.5 rounded-xl font-extrabold text-sm flex items-center justify-center gap-2 transition active:scale-[0.98] ${
                isChecked
                  ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/25 animate-pop'
                  : 'bg-slate-800/90 hover:bg-slate-700 border border-slate-700 text-slate-200'
              }">
              <span class="w-5 h-5 rounded-full flex items-center justify-center text-xs ${isChecked ? 'bg-slate-950 text-emerald-400' : 'border border-slate-500 text-transparent'}">✓</span>
              <span>${isChecked ? '已完成 ✓' : btnLabel}</span>
            </button>
          `;
        } else {
          const buttons = [];
          for (let s = 0; s < ex.sets; s++) {
            const checkKey = `${ex.id}_${s}`;
            const isChecked = !!appState.checks[checkKey];
            buttons.push(`
              <button type="button" data-check-key="${checkKey}" data-ex-type="strength"
                class="set-check-btn min-h-[48px] px-2 py-2 rounded-xl font-extrabold text-xs sm:text-sm flex items-center justify-center gap-1.5 transition active:scale-95 ${
                  isChecked
                    ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/25 animate-pop'
                    : 'bg-slate-800/90 hover:bg-slate-700 border border-slate-700 text-slate-200'
                }">
                <span class="w-4 h-4 rounded-full flex items-center justify-center text-[10px] ${isChecked ? 'bg-slate-950 text-emerald-400' : 'border border-slate-500 text-transparent'}">✓</span>
                <span>第 ${s + 1} 組</span>
              </button>
            `);
          }
          setsHtml = `<div class="grid grid-cols-2 sm:grid-cols-4 gap-2">${buttons.join('')}</div>`;
        }

        // 步驟列表 HTML
        const stepsListHtml = ex.steps.map(step => `<li class="text-xs sm:text-[13px] text-slate-300 leading-relaxed">${step}</li>`).join('');

        card.innerHTML = `
          <div class="p-4">
            <!-- 卡片標頭：序號、動作名稱、組數×次數標籤 -->
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-start gap-2.5 min-w-0">
                <span class="w-7 h-7 rounded-lg ${isExAllDone ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-sky-400 border border-slate-700'} font-black text-xs flex items-center justify-center shrink-0 mt-0.5">
                  ${isExAllDone ? '✓' : index + 1}
                </span>
                <div class="min-w-0">
                  <h3 class="text-base sm:text-lg font-extrabold text-white leading-snug">${ex.name}</h3>
                  <!-- 文東路官方器械高亮標籤 -->
                  <div class="mt-1 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-sky-500/12 border border-sky-500/30 text-sky-300 text-xs font-bold">
                    <svg class="w-3.5 h-3.5 text-sky-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <span>${ex.machine}</span>
                  </div>
                </div>
              </div>

              <!-- 目標組數次數徽章 -->
              <span class="shrink-0 px-2.5 py-1 rounded-lg bg-slate-800 border border-slate-700 text-xs font-extrabold text-emerald-400">
                ${isCardio ? ex.reps : `${ex.sets} 組 × ${ex.reps}`}
              </span>
            </div>

            <!-- 重量 / 阻力 / 參數紀錄輸入欄 -->
            <div class="mt-3.5 bg-[#0E1624] rounded-xl p-2.5 border border-slate-800/90 flex items-center gap-2.5">
              <label for="weight_${ex.id}" class="text-xs font-bold text-slate-400 shrink-0 flex items-center gap-1">
                <span>⚖️</span>
                <span>${isCardio ? '參數／備註' : '重量／格數'}</span>
              </label>
              <input id="weight_${ex.id}" type="text" data-ex-id="${ex.id}"
                value="${savedWeight.replace(/"/g, '&quot;')}"
                placeholder="${ex.placeholder}"
                class="weight-input w-full bg-slate-900/90 text-white placeholder-slate-500 text-sm font-bold px-3 py-2 rounded-lg border border-slate-700 focus:border-sky-400 focus:outline-none focus:ring-1 focus:ring-sky-400 transition"
              />
            </div>

            <!-- 逐組打勾紀錄按鈕群 -->
            <div class="mt-3.5">
              ${setsHtml}
            </div>

            <!-- 可展開的「📖 器械調校與動作步驟」折疊按鈕 -->
            <div class="mt-3.5 pt-3 border-t border-slate-800/80">
              <button type="button" data-toggle-ex="${ex.id}"
                class="accordion-toggle-btn w-full min-h-[44px] px-3 py-2 rounded-xl bg-slate-800/60 hover:bg-slate-800 border border-slate-700/80 flex items-center justify-between text-xs sm:text-sm font-bold text-sky-300 transition">
                <span class="flex items-center gap-1.5">
                  <span>📖</span>
                  <span>器械調校與動作步驟（含體態矯正）</span>
                </span>
                <svg class="w-4 h-4 text-slate-400 transition-transform duration-200 ${isExpanded ? 'rotate-180' : ''}" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                </svg>
              </button>

              <!-- 折疊內容面板 -->
              <div id="accordion_${ex.id}" class="accordion-content ${isExpanded ? 'open' : ''}">
                <div class="accordion-inner">
                  <div class="mt-3 space-y-3 bg-[#0E1624] rounded-xl p-3.5 border border-slate-800">
                    <!-- 1. 官方器械名稱 -->
                    <div>
                      <div class="text-[11px] font-extrabold uppercase tracking-wider text-sky-400 mb-1">① 文東路官方器械</div>
                      <div class="text-xs sm:text-sm font-bold text-white">${ex.machine}</div>
                    </div>

                    <!-- 2. 器械調校方法 -->
                    <div>
                      <div class="text-[11px] font-extrabold uppercase tracking-wider text-emerald-400 mb-1">② 器械座椅／滑輪／把柄調校</div>
                      <p class="text-xs sm:text-[13px] text-slate-300 leading-relaxed">${ex.setup}</p>
                    </div>

                    <!-- 3. 分步動作教學 -->
                    <div>
                      <div class="text-[11px] font-extrabold uppercase tracking-wider text-slate-300 mb-1">③ 分步動作執行教學</div>
                      <ul class="space-y-1.5">
                        ${stepsListHtml}
                      </ul>
                    </div>

                    <!-- 4. 體態矯正發力口訣 -->
                    <div class="bg-amber-500/10 border border-amber-500/30 rounded-xl p-3">
                      <div class="text-[11px] font-extrabold text-amber-400 flex items-center gap-1 mb-1">
                        <span>⚠️</span>
                        <span>④ 體態矯正發力口訣（防代償）</span>
                      </div>
                      <p class="text-xs sm:text-[13px] text-amber-100/95 font-medium leading-relaxed">${ex.postureCue}</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;

        container.appendChild(card);
      });

      bindCardEvents();
    }

    // 綁定卡片內的動態互動事件
    function bindCardEvents() {
      // 1. 逐組打勾事件
      document.querySelectorAll('.set-check-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const checkKey = btn.dataset.checkKey;
          const exType = btn.dataset.exType;
          const wasChecked = !!appState.checks[checkKey];
          const nowChecked = !wasChecked;

          if (nowChecked) {
            appState.checks[checkKey] = true;
            // 若為重訓動作打勾，自動啟動底部 60 秒組間休息倒數
            if (exType === 'strength') {
              startRestTimer(DEFAULT_REST_SECONDS);
            }
          } else {
            delete appState.checks[checkKey];
          }

          saveState();
          renderDayTabs();
          updateHeaderDashboard();
          renderWorkoutCards();
        });
      });

      // 2. 重量／阻力輸入框即時自動儲存
      document.querySelectorAll('.weight-input').forEach(input => {
        input.addEventListener('input', (e) => {
          const exId = e.target.dataset.exId;
          appState.weights[exId] = e.target.value;
          saveState();
        });
      });

      // 3. 折疊面板展開／收合
      document.querySelectorAll('.accordion-toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const exId = btn.dataset.toggleEx;
          const isOpen = !!appState.expanded[exId];
          appState.expanded[exId] = !isOpen;

          const panel = document.getElementById(`accordion_${exId}`);
          const arrow = btn.querySelector('svg');
          if (panel) {
            panel.classList.toggle('open', !isOpen);
          }
          if (arrow) {
            arrow.classList.toggle('rotate-180', !isOpen);
          }
        });
      });
    }

    function renderAll() {
      renderDayTabs();
      updateHeaderDashboard();
      renderWorkoutCards();
    }

    /**
     * =========================================================================
     * 6. 重置本週進度視窗與 Toast 提示邏輯
     * =========================================================================
     */
    const resetModal = document.getElementById('resetModal');
    const openResetModalBtn = document.getElementById('openResetModalBtn');
    const closeResetModalBtn = document.getElementById('closeResetModalBtn');
    const resetChecksOnlyBtn = document.getElementById('resetChecksOnlyBtn');
    const resetAllDataBtn = document.getElementById('resetAllDataBtn');

    function showToast(message) {
      const toast = document.getElementById('toastMsg');
      const toastText = document.getElementById('toastText');
      toastText.textContent = message;
      toast.classList.remove('opacity-0');
      setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 2400);
    }

    openResetModalBtn.addEventListener('click', () => {
      resetModal.classList.remove('hidden');
      resetModal.classList.add('flex');
    });

    closeResetModalBtn.addEventListener('click', () => {
      resetModal.classList.add('hidden');
      resetModal.classList.remove('flex');
    });

    resetModal.addEventListener('click', (e) => {
      if (e.target === resetModal) {
        resetModal.classList.add('hidden');
        resetModal.classList.remove('flex');
      }
    });

    // 只清除本週打勾進度（保留重量紀錄）
    resetChecksOnlyBtn.addEventListener('click', () => {
      appState.checks = {};
      saveState();
      resetTimerTo60();
      renderAll();
      resetModal.classList.add('hidden');
      resetModal.classList.remove('flex');
      showToast('已清除本週打勾進度，重量紀錄已保留');
    });

    // 全部重置（含重量紀錄）
    resetAllDataBtn.addEventListener('click', () => {
      appState.checks = {};
      appState.weights = {};
      saveState();
      resetTimerTo60();
      renderAll();
      resetModal.classList.add('hidden');
      resetModal.classList.remove('flex');
      showToast('已全部重置本週進度與重量紀錄');
    });

    /**
     * =========================================================================
     * 7. 應用程式初始化啟動
     * =========================================================================
     */
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderAll();
      updateTimerUI();

      // 初次載入時將目前選中的 Day 分頁捲動至可視範圍
      const activeTab = document.querySelector(`#dayTabsContainer button[data-day="${appState.activeDay}"]`);
      if (activeTab) {
        activeTab.scrollIntoView({ behavior: 'auto', inline: 'center', block: 'nearest' });
      }
    });
  </script>
</body>
</html>
