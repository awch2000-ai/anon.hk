<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>anon.hk | 應用程式中心</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- 頂部導航欄 -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-lg shadow-lg shadow-indigo-600/30">
          A
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">anon.hk</h1>
          <p class="text-xs text-slate-400">網頁應用程式及互動小工具中心</p>
        </div>
      </div>

      <div class="flex items-center gap-3 w-full sm:w-auto">
        <input
          id="searchInput"
          type="text"
          placeholder="🔍 搜尋應用程式..."
          class="w-full sm:w-64 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
        />
        <a
          href="./admin.html"
          class="text-xs px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition whitespace-nowrap"
          title="開啟管理後台"
        >
          ⚙️ 管理後台
        </a>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
    <!-- 分類篩選按鈕 -->
    <div id="categoryBar" class="flex flex-wrap gap-2 mb-6"></div>

    <!-- 應用程式卡片網格 -->
    <div id="appsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      <div class="col-span-full text-center py-16 text-slate-500">正在載入應用程式...</div>
    </div>
  </main>

  <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-500">
    Powered by anon.hk
  </footer>

  <script>
    let allApps = [];
    let activeCategory = '全部';

    async function loadApps() {
      const grid = document.getElementById('appsGrid');
      try {
        const res = await fetch(`./apps.json?t=${Date.now()}`);
        if (!res.ok) throw new Error('無法讀取 apps.json');
        allApps = await res.json();
        renderCategories();
        renderApps();
      } catch (err) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-16 text-slate-400">
            <p class="text-lg font-medium mb-1">暫時未有已發佈的應用程式</p>
            <p class="text-sm text-slate-500">請前往 <a href="./admin.html" class="text-indigo-400 underline">/admin.html</a> 上傳你的第一個單頁 HTML 應用。</p>
          </div>`;
      }
    }

    function renderCategories() {
      const categories = ['全部', ...new Set(allApps.map(a => a.category || '一般'))];
      const bar = document.getElementById('categoryBar');
      bar.innerHTML = categories.map(cat => `
        <button
          onclick="setCategory('${cat.replace(/'/g, "\\'")}')"
          class="px-3.5 py-1.5 rounded-full text-xs font-medium transition ${
            activeCategory === cat
              ? 'bg-indigo-600 text-white'
              : 'bg-slate-900 text-slate-400 hover:bg-slate-800 border border-slate-800'
          }"
        >
          ${cat}
        </button>
      `).join('');
    }

    function setCategory(cat) {
      activeCategory = cat;
      renderCategories();
      renderApps();
    }

    function renderApps() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const grid = document.getElementById('appsGrid');

      const filtered = allApps.filter(app => {
        const matchesCat = activeCategory === '全部' || (app.category || '一般') === activeCategory;
        const matchesQuery =
          app.title.toLowerCase().includes(query) ||
          (app.description || '').toLowerCase().includes(query) ||
          (app.category || '').toLowerCase().includes(query);
        return matchesCat && matchesQuery;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">找不到符合條件的應用程式。</div>`;
        return;
      }

      grid.innerHTML = filtered.map(app => `
        <a
          href="./${app.path}"
          target="_blank"
          class="group bg-slate-900/90 hover:bg-slate-900 border border-slate-800 hover:border-indigo-500/60 rounded-2xl p-5 transition-all duration-200 flex flex-col justify-between shadow-sm hover:shadow-indigo-500/10"
        >
          <div>
            <div class="flex items-start justify-between gap-3 mb-3">
              <div class="w-12 h-12 rounded-xl bg-slate-800 flex items-center justify-center text-2xl">
                ${app.icon || '🚀'}
              </div>
              <span class="text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
                ${app.category || '一般'}
              </span>
            </div>
            <h2 class="text-base font-semibold text-slate-100 group-hover:text-indigo-400 transition mb-1">
              ${app.title}
            </h2>
            <p class="text-xs text-slate-400 line-clamp-2">
              ${app.description || '單頁式 HTML 互動應用程式'}
            </p>
          </div>
          <div class="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-500">
            <span>${app.date || ''}</span>
            <span class="text-indigo-400 group-hover:translate-x-0.5 transition">開啟應用 →</span>
          </div>
        </a>
      `).join('');
    }

    document.getElementById('searchInput').addEventListener('input', renderApps);
    loadApps();
  </script>
</body>
</html>
